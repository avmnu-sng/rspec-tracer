plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  Exclude:
    - "rspec-tracer.gemspec"
    - "benchmark/fixtures/**/*"
    - "lib/rspec_tracer/reporters/html/**/*"
    - "spec/fixtures/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

# spec/fuzz/ holds standalone ruby harness scripts, not RSpec specs.
# Exempt them from rubocop-rspec so cops like RSpec/Output don't strip
# the reporting puts.
RSpec:
  Exclude:
    - "spec/fuzz/**/*"

Layout/ClassStructure:
  Enabled: true
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
  ExpectedOrder:
    - module_inclusion
    - constants
    - public_class_methods
    - initializer
    - instance_methods
    - protected_methods
    - private_methods

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Metrics/AbcSize:
  Max: 35

Metrics/BlockLength:
  Exclude:
    - "tasks/**/*"
    - "spec/**/*"
    - "Gemfile"

Metrics/ClassLength:
  Max: 300

Metrics/CyclomaticComplexity:
  Max: 10

# Edge-case specs (M8.2) drive the storage layer end-to-end - mktmpdir +
# save + corruption + load + multiple invariant checks. Same posture the
# fuzz dir already gets via the RSpec block above.
Metrics/MethodLength:
  Max: 25
  Exclude:
    - "spec/edge_cases/**/*"

Metrics/ModuleLength:
  Max: 300

RSpec/ExampleLength:
  Exclude:
    - "spec/edge_cases/**/*"
    - "spec/support/integration_cleanup_spec.rb"

RSpec/MultipleExpectations:
  Exclude:
    - "spec/edge_cases/**/*"
    - "spec/support/integration_cleanup_spec.rb"

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/SpecFilePathSuffix:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

Style/Documentation:
  Enabled: false
