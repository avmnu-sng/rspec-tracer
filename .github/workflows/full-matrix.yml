---
name: full-matrix

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # Single source of truth for the compat matrix. Downstream jobs
  # consume these outputs via fromJSON(), so adding (say) Ruby 4.1 is
  # one line here instead of four edits across spec/ruby-project/
  # ruby-parallel/rails.
  matrix-config:
    name: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rubies: ${{ steps.cfg.outputs.rubies }}
      rspecs: ${{ steps.cfg.outputs.rspecs }}
      rails_cells: ${{ steps.cfg.outputs.rails_cells }}
      jruby: ${{ steps.cfg.outputs.jruby }}
    steps:
      - name: Emit matrix config
        id: cfg
        # rails_cells pairs each (ruby, rails) with the matching rspec-rails
        # and sqlite3 majors. rspec-rails 6.1 for Rails ≤ 7.1, 7.0 for Rails
        # ≥ 7.2; sqlite3 1.4 for Rails ≤ 7.2.
        # Rails 8.0 cells are deferred pending M4.3: the current cucumber
        # features (sample_projects/rails_app, Rails 7-tuned) hardcode
        # coverage assertions like "71 / 84 LOC (84.52%)" whose line counts
        # shift under Rails 8.0's different initializer load pattern.
        # Re-add 8.0 cells when M4.3 wires the new fixture
        # (spec/fixtures/rails_app, 8.0-capable) into the CI test target.
        run: |
          rails_cells=$(cat <<'JSON' | tr -d '\n'
          [
            {"ruby":"3.1","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.1","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.1","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"}
          ]
          JSON
          )
          {
            echo 'rubies=["3.1","3.2","3.3","3.4","4.0"]'
            echo 'rspecs=["3.12","3.13"]'
            echo 'jruby=jruby-9.4'
            echo "rails_cells=${rails_cells}"
          } >> "$GITHUB_OUTPUT"

  spec:
    name: spec (ruby-${{ matrix.ruby }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Unit
        run: task test:unit

  ruby-project:
    name: ruby-project (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (Ruby)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          BRANCH_COVERAGE: 'true'
        run: task test:features:ruby

  ruby-parallel:
    name: ruby-parallel (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (Ruby, parallel_tests)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          PARALLEL_TESTS_VERSION: "~> 4.7"
        run: task test:features:ruby-parallel

  rails:
    name: rails (ruby-${{ matrix.ruby }}, rails-${{ matrix.rails }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIMPLECOV_VERSION: "~> 0.22"
      BRANCH_COVERAGE: 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.rails_cells) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (Rails)
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec_rails }}.0"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
        run: task test:features:rails

  jruby:
    name: jruby
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools for JRuby native extensions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.matrix-config.outputs.jruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (JRuby)
        env:
          RSPEC_VERSION: "~> 3.13.0"
          SIMPLECOV_VERSION: "~> 0.22"
        run: task test:features:jruby

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Canonical benchmark cell — comparing across Rubies adds noise
          # without signal, so pin to the .ruby-version floor.
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install fixture bundles
        run: task benchmark:bundle

      - name: Prepare Rails fixture database
        run: bundle exec rails db:test:prepare
        working-directory: spec/fixtures/rails_app
        env:
          RAILS_VERSION: "~> 7.1.0"
          RSPEC_RAILS_VERSION: "~> 6.1.0"
          SIMPLECOV_VERSION: "~> 0.22"
          SQLITE3_VERSION: "~> 1.4"

      - name: Benchmark — full (no enforcement; CI baseline not yet committed)
        # Ratchet file was generated on Apple M2 Max; GHA ubuntu-latest
        # (2-core VMs) runs 3-5× slower, so enforcement would always
        # fail. See benchmark/README.md for the CI-baseline followup.
        run: |
          ruby benchmark/harness.rb --full \
            --ratchet benchmark/ratchet.json \
            --no-enforce \
            --summary-md benchmark/ci-summary.md

      - name: Upload benchmark summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmark/ci-summary.md
          if-no-files-found: error
