---
name: full-matrix

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # Single source of truth for the compat matrix. Downstream jobs
  # consume these outputs via fromJSON(), so adding (say) Ruby 4.1 is
  # one line here instead of four edits across spec/ruby-project/
  # ruby-parallel/rails.
  matrix-config:
    name: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rubies: ${{ steps.cfg.outputs.rubies }}
      rspecs: ${{ steps.cfg.outputs.rspecs }}
      rails_cells: ${{ steps.cfg.outputs.rails_cells }}
      jruby: ${{ steps.cfg.outputs.jruby }}
      truffleruby: ${{ steps.cfg.outputs.truffleruby }}
    steps:
      - name: Emit matrix config
        id: cfg
        # rails_cells pairs each (ruby, rails) with the matching rspec-rails
        # and sqlite3 majors. rspec-rails 6.1 for Rails ≤ 7.1, 7.0 for Rails
        # ≥ 7.2; sqlite3 1.4 for Rails ≤ 7.2.
        # Rails 8.0 cells are deferred pending M4.3: the current cucumber
        # features (sample_projects/rails_app, Rails 7-tuned) hardcode
        # coverage assertions like "71 / 84 LOC (84.52%)" whose line counts
        # shift under Rails 8.0's different initializer load pattern.
        # Re-add 8.0 cells when M4.3 wires the new fixture
        # (spec/fixtures/rails_app, 8.0-capable) into the CI test target.
        run: |
          rails_cells=$(cat <<'JSON' | tr -d '\n'
          [
            {"ruby":"3.1","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.1","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.1","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"jruby-9.4","rails":"7.1","rspec_rails":"6.1","sqlite3":"jdbc"}
          ]
          JSON
          )
          {
            echo 'rubies=["3.1","3.2","3.3","3.4","4.0"]'
            echo 'rspecs=["3.12","3.13"]'
            echo 'jruby=jruby-9.4'
            # TruffleRuby pinned to a concrete patch — 24.2.1 is the latest
            # 24.x setup-ruby ships a prebuilt for on ubuntu-24.04 as of
            # 2026-04-28 (24.2.2 is tagged on github.com/oracle/truffleruby
            # but no prebuilt yet). Best-effort cell is continue-on-error
            # so it never blocks merges; pinning still matters for
            # reproducible signal across runs. Bump when the prebuilt
            # catches up.
            echo 'truffleruby=truffleruby-24.2.1'
            echo "rails_cells=${rails_cells}"
          } >> "$GITHUB_OUTPUT"

  spec:
    name: spec (ruby-${{ matrix.ruby }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # Bundler 4.x needs Ruby >= 3.2; Bundler 2.7+ needs Ruby >= 3.2.
          # 2.6.9 is the last 2.x line that supports Ruby 3.1.
          bundler: ${{ matrix.ruby == '3.1' && '2.6.9' || '4.0.10' }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle — list resolved versions
        run: bundle list

      - name: Test — Unit
        run: task test:unit

      - name: Test — Edge cases
        run: task test:edge-cases

  spec-floor:
    # Floor-pin sanity cell: pins every multi-line dep to its currently
    # maintained legacy major (redis 4.8, msgpack 1.7, parallel_tests
    # 4.10, rspec 3.12) on the oldest supported Ruby (3.1). Catches
    # regressions in the "user with org-mandated pins to legacy stack"
    # scenario that the relaxed-pin default cells would not exercise
    # (they pick latest-of-each-major). Per-PR + per-main cadence runs
    # this single cell; the weekly combinations.yml does the full
    # cross-product.
    name: spec-floor (ruby-3.1, redis-4.8, rspec-3.12, msgpack-1.7, parallel_tests-4.10)
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RSPEC_TRACER_REDIS_VERSION: "~> 4.8.0"
      RSPEC_VERSION: "~> 3.12.0"
      RSPEC_TRACER_MSGPACK_VERSION: "~> 1.7.0"
      RSPEC_TRACER_PARALLEL_TESTS_VERSION: "~> 4.10.0"
      # connection_pool 3.x and parallel 2.x are gated by Ruby >= 3.2 /
      # 3.3 respectively; on Ruby 3.1 Bundler picks the only available
      # major. No explicit pin needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler: '2.6.9'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle — list resolved versions
        run: bundle list

      - name: Test — Unit
        run: task test:unit

      - name: Test — Edge cases
        run: task test:edge-cases

  ruby-project:
    name: ruby-project (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level env so `bundle install` (in setup-ruby) sees
    # RSPEC_VERSION too — the root Gemfile reads it via ENV.fetch.
    # Setting only at the test step would resolve to the default rspec
    # at install time and the test step's env would have no effect.
    env:
      RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
      BRANCH_COVERAGE: 'true'
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.ruby == '3.1' && '2.6.9' || '4.0.10' }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle — list resolved versions
        run: bundle list

      - name: Test — Features (Ruby)
        run: task test:features:ruby

  ruby-parallel:
    name: ruby-parallel (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level env so RSPEC_VERSION reaches setup-ruby's bundle install
    # (root Gemfile reads it via ENV.fetch). PARALLEL_TESTS_VERSION
    # stays per-step because the two test steps vary it.
    env:
      RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.ruby == '3.1' && '2.6.9' || '4.0.10' }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle — list resolved versions
        run: bundle list

      - name: Test — Features (Ruby, parallel_tests 4.10)
        env:
          PARALLEL_TESTS_VERSION: "~> 4.10.0"
        run: task test:features:ruby-parallel

      - name: Test — Features (Ruby, parallel_tests 5.7)
        env:
          PARALLEL_TESTS_VERSION: "~> 5.7.0"
        run: task test:features:ruby-parallel

  rails:
    name: rails (ruby-${{ matrix.ruby }}, rails-${{ matrix.rails }})
    needs: matrix-config
    runs-on: ubuntu-latest
    # First M8.6-B push experimented with a 20-min ceiling here, but
    # the cold-cache run on PR #130 was cancelled at 20:30 elapsed
    # (scenario 7 of 12 had just finished; cache post-hook didn't run,
    # so neither the new ~/.m2 nor fixture vendor/bundle cache saved).
    # Per-scenario JRuby+Rails subprocess cold boot averages ~2:30 on
    # ubuntu-latest, so 12 scenarios alone need ~30 min — Maven +
    # vendor/bundle caching saves ~3 min on warm runs but doesn't move
    # the wall clock under 20. Reverted to 30 to let cold runs finish
    # cleanly. Brief's <12 min target turned out unreachable under
    # M5.1's cold-subprocess isolation contract with the current
    # scenario count; documented as a finding, not a deferral.
    timeout-minutes: 30
    env:
      BRANCH_COVERAGE: 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.rails_cells) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # JRuby 9.4 cell: install build-essential for any native ext compile
      # under JRuby's gem graph (matches the standalone `jruby:` job).
      # MRI cells skip this — ubuntu-latest already ships build-essential.
      - name: Install build tools for JRuby native extensions
        if: matrix.ruby == 'jruby-9.4'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # JRuby 9.4 emulates Ruby 3.1; pin Bundler 2.6.9 (last 2.x line
          # supporting Ruby 3.1) on both 3.1 and JRuby cells. Everything
          # else uses Bundler 4.x.
          bundler: ${{ (matrix.ruby == '3.1' || matrix.ruby == 'jruby-9.4') && '2.6.9' || '4.0.10' }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # M8.6-B Lever 1a: cache the JRuby Maven plugin tree. The fixture
      # Gemfile pulls activerecord-jdbcsqlite3-adapter on JRuby, which
      # downloads ~25 Maven JARs (jdbc-sqlite3 + Maven plugins) on first
      # install. The download is ~30-60s per cold-cache run and is
      # invisible to setup-ruby's bundler-cache (that cache keys on the
      # parent Gemfile.lock and tracks gem fetches, not Maven artifacts).
      # Caching ~/.m2 keyed on the fixture Gemfile lets warm-cache runs
      # skip the Maven fetch entirely.
      - name: Cache ~/.m2 (JRuby Maven plugins for activerecord-jdbcsqlite3-adapter)
        if: matrix.ruby == 'jruby-9.4'
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-jruby-${{ hashFiles('spec/fixtures/rails_app/Gemfile') }}
          restore-keys: |
            m2-${{ runner.os }}-jruby-

      # M8.6-B Lever 1b: cache the fixture's vendor/bundle so warm-cache
      # runs reuse the gem set across PRs. Same pattern as the
      # `benchmark:` job's fixture-bundle cache (full-matrix.yml's
      # `Cache rails_app fixture bundle` step). Key includes matrix.ruby
      # implicitly via the `-jruby-` literal segment so we never restore
      # an MRI-resolved cache onto the JRuby cell. Gemfile.lock isn't in
      # the key because it's gitignored and regenerated per interpreter;
      # bundler regenerates it cheaply when the cached gems are present.
      - name: Cache rails_app fixture bundle (JRuby gem set)
        if: matrix.ruby == 'jruby-9.4'
        uses: actions/cache@v5
        with:
          path: spec/fixtures/rails_app/vendor/bundle
          key: fixture-bundle-rails-app-${{ runner.os }}-jruby-${{ hashFiles('spec/fixtures/rails_app/Gemfile') }}
          restore-keys: |
            fixture-bundle-rails-app-${{ runner.os }}-jruby-

      # Point the fixture's Bundler at vendor/bundle so the cache step
      # above actually catches the install output. `bundle config set
      # --local` writes the gitignored fixture-scoped .bundle/config and
      # leaves the parent project's bundler context untouched. Mirrors
      # the benchmark cell's `Point fixture bundler at vendor/bundle`
      # step.
      - name: Point fixture bundler at vendor/bundle (JRuby cell)
        if: matrix.ruby == 'jruby-9.4'
        run: cd spec/fixtures/rails_app && bundle config set --local path vendor/bundle

      - name: Bundle — list resolved versions
        run: bundle list

      - name: Test — Features (Rails, MRI)
        if: matrix.ruby != 'jruby-9.4'
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec_rails }}.0"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
        run: task test:features:rails

      - name: Test — Features (Rails, MRI, narrow AR schema)
        if: matrix.ruby != 'jruby-9.4'
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec_rails }}.0"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
        run: task test:features:rails:narrow-schema

      # JRuby cell: fixture Gemfile branches on RUBY_ENGINE and pulls in
      # activerecord-jdbcsqlite3-adapter ~> 71.0 (Rails 7.1 line). The
      # JDBC chain registers itself as the "sqlite3" adapter so
      # config/database.yml needs no JRuby-specific tweak. SQLITE3_VERSION
      # is unused on the JRuby branch but passed for symmetry with MRI.
      - name: Test — Features (Rails, JRuby)
        if: matrix.ruby == 'jruby-9.4'
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec_rails }}.0"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
        run: task test:features:rails:jruby

      - name: Test — Features (Rails, JRuby, narrow AR schema)
        if: matrix.ruby == 'jruby-9.4'
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec_rails }}.0"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
        run: task test:features:rails:narrow-schema:jruby

  jruby:
    name: jruby
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools for JRuby native extensions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.matrix-config.outputs.jruby }}
          # JRuby 9.4 emulates Ruby 3.1; pin to last Bundler 2.x that
          # supports it (Bundler 2.7+ and 4.x both require Ruby >= 3.2).
          bundler: '2.6.9'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle — list resolved versions
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: bundle list

      - name: Test — Features (JRuby)
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: task test:features:jruby

      - name: Test — Edge cases (JRuby — concurrent_write + sqlite cases auto-skip)
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: task test:edge-cases

      # Exercises the per-interpreter benchmark ratchet mechanically.
      # benchmark/harness.rb scales the canonical MRI ratchet by the
      # JRuby multiplier (10.0x — calibrated to empirical M2 Max
      # measurements where JVM boot per-iter dominates wall clock).
      # --no-enforce keeps first-run miscalibration non-blocking;
      # tighten to enforce-mode after a few CI runs settle the variance.
      - name: Test — Benchmark smoke (JRuby — informational; ratchet x10.0)
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: task benchmark:smoke:no-enforce

  truffleruby:
    # TruffleRuby 24.x best-effort cell. continue-on-error keeps failures
    # non-blocking — TruffleRuby gem-resolution + native ext support has
    # been historically uneven, so this stays signal-only. Per-PR cadence
    # keeps signal fresh; runs the same ruby_app + dogfood fixture set
    # as the JRuby cell minus JRUBY_OPTS. Edge cases auto-skip via the
    # existing RUBY_ENGINE == 'ruby' guards on the SQLite + fork specs:
    # TruffleRuby has RUBY_ENGINE == 'truffleruby', so the same skip
    # paths fire as on JRuby.
    name: truffleruby
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.matrix-config.outputs.truffleruby }}
          # TruffleRuby 24.2.2 emulates Ruby 3.3.5; bundler 4.0.10
          # (the >= 3.2 Ruby cells' default) is supported.
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle — list resolved versions
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: bundle list

      - name: Test — Features (TruffleRuby)
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: task test:features:truffleruby

      - name: Test — Edge cases (TruffleRuby — concurrent_write + sqlite cases auto-skip)
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: task test:edge-cases

      # Same purpose as the JRuby benchmark step above; TruffleRuby's
      # multiplier is 5.0x (conservative starting point; refine after
      # first cell empirical data). Job-level continue-on-error +
      # task-level --no-enforce make any benchmark failure doubly safe.
      - name: Test — Benchmark smoke (TruffleRuby — informational; ratchet x5.0)
        env:
          RSPEC_VERSION: "~> 3.13.0"
        run: task benchmark:smoke:no-enforce

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Canonical benchmark cell: fix every ENV-driven fixture version at
    # the job level so `task benchmark:bundle` (which runs `bundle
    # install` inside spec/fixtures/rails_app) and the later
    # `rails db:test:prepare` step resolve against the same Rails
    # lockfile. A step-scoped env on the db:prepare step alone leaves
    # benchmark:bundle to pick up the Gemfile default (Rails 7.2.3.1+
    # since the activestorage CVE fix), which then conflicts with a
    # 7.1-pinned resolver run. Keeps the benchmark pinned to Rails
    # 7.1 for cross-run comparability regardless of the fixture's
    # default moving forward.
    env:
      RAILS_VERSION: "~> 7.1.0"
      RSPEC_RAILS_VERSION: "~> 6.1.0"
      SQLITE3_VERSION: "~> 1.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Canonical benchmark cell — comparing across Rubies adds noise
          # without signal, so pin to the .ruby-version floor.
          ruby-version: '.ruby-version'
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fixture bundles are fetched fresh on every run by default -
      # setup-ruby's bundler-cache only keys on the outer project's
      # Gemfile.lock. Cache each fixture's vendor/bundle dir
      # separately so repeat runs reuse the downloaded gems. Key
      # includes the Gemfile hash and the Ruby version file so a
      # toolchain bump invalidates the cache.
      - name: Cache benchmark ruby_app fixture bundle
        uses: actions/cache@v5
        with:
          path: benchmark/fixtures/ruby_app/vendor/bundle
          key: fixture-bundle-ruby-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('benchmark/fixtures/ruby_app/Gemfile') }}
          restore-keys: |
            fixture-bundle-ruby-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-

      # The Rails fixture Gemfile branches on RAILS_VERSION /
      # RSPEC_RAILS_VERSION / SQLITE3_VERSION at resolve time, so the
      # cache key must include them to avoid serving a stale set when
      # the matrix pin moves. simplecov is hardcoded `~> 0.22` in the
      # fixture Gemfile so it does not need to enter the cache key.
      - name: Cache rails_app fixture bundle
        uses: actions/cache@v5
        with:
          path: spec/fixtures/rails_app/vendor/bundle
          # Folded scalar: line breaks land inside `${{ }}` so the
          # inserted whitespace is harmless to the expression parser;
          # the evaluated cache key contains no internal spaces.
          key: >-
            fixture-bundle-rails-app-${{ runner.os
            }}-${{ hashFiles('.ruby-version')
            }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile')
            }}-${{ env.RAILS_VERSION
            }}-${{ env.RSPEC_RAILS_VERSION
            }}-${{ env.SQLITE3_VERSION }}
          restore-keys: |
            fixture-bundle-rails-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile') }}-
            fixture-bundle-rails-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-

      # `bundle config set --local` writes to each fixture's
      # .bundle/config (gitignored), scoping the path redirect to
      # that Gemfile's context. Outer-project bundle commands stay on
      # the setup-ruby-managed path.
      - name: Point fixture bundler at vendor/bundle
        run: |
          (cd benchmark/fixtures/ruby_app && bundle config set --local path vendor/bundle)
          (cd spec/fixtures/rails_app && bundle config set --local path vendor/bundle)

      - name: Install fixture bundles
        run: task benchmark:bundle

      - name: Prepare Rails fixture database
        run: bundle exec rails db:test:prepare
        working-directory: spec/fixtures/rails_app

      - name: Benchmark — full (no enforcement; CI baseline not yet committed)
        # Ratchet file was generated on Apple M2 Max; GHA ubuntu-latest
        # (2-core VMs) runs 3-5× slower, so enforcement would always
        # fail. See benchmark/README.md for the CI-baseline followup.
        run: |
          ruby benchmark/harness.rb --full \
            --ratchet benchmark/ratchet.json \
            --no-enforce \
            --summary-md benchmark/ci-summary.md

      - name: Upload benchmark summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-summary
          path: benchmark/ci-summary.md
          if-no-files-found: error
