---
name: full-matrix

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # Single source of truth for the compat matrix. Downstream jobs
  # consume these outputs via fromJSON(), so adding (say) Ruby 4.1 is
  # one line here instead of four edits across spec/ruby-project/
  # ruby-parallel/rails.
  matrix-config:
    name: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rubies: ${{ steps.cfg.outputs.rubies }}
      rspecs: ${{ steps.cfg.outputs.rspecs }}
      rails_cells: ${{ steps.cfg.outputs.rails_cells }}
      jruby: ${{ steps.cfg.outputs.jruby }}
    steps:
      - name: Emit matrix config
        id: cfg
        # rails_cells pairs each (ruby, rails) with the matching rspec-rails
        # and sqlite3 majors. rspec-rails 6.1 for Rails ≤ 7.1, 7.0 for Rails
        # ≥ 7.2; sqlite3 1.4 for Rails ≤ 7.2.
        # Rails 8.0 cells are deferred pending M4.3: the current cucumber
        # features (sample_projects/rails_app, Rails 7-tuned) hardcode
        # coverage assertions like "71 / 84 LOC (84.52%)" whose line counts
        # shift under Rails 8.0's different initializer load pattern.
        # Re-add 8.0 cells when M4.3 wires the new fixture
        # (spec/fixtures/rails_app, 8.0-capable) into the CI test target.
        run: |
          rails_cells=$(cat <<'JSON' | tr -d '\n'
          [
            {"ruby":"3.1","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.1","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.1","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.2","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.3","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"3.4","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.0","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.1","rspec_rails":"6.1","sqlite3":"1.4"},
            {"ruby":"4.0","rails":"7.2","rspec_rails":"7.0","sqlite3":"1.4"}
          ]
          JSON
          )
          {
            echo 'rubies=["3.1","3.2","3.3","3.4","4.0"]'
            echo 'rspecs=["3.12","3.13"]'
            echo 'jruby=jruby-9.4'
            echo "rails_cells=${rails_cells}"
          } >> "$GITHUB_OUTPUT"

  spec:
    name: spec (ruby-${{ matrix.ruby }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Unit
        run: task test:unit

  ruby-project:
    name: ruby-project (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (Ruby)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          BRANCH_COVERAGE: 'true'
        run: task test:features:ruby

  ruby-parallel:
    name: ruby-parallel (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (Ruby, parallel_tests)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          PARALLEL_TESTS_VERSION: "~> 4.7"
        run: task test:features:ruby-parallel

      - name: Test — Features (Ruby, parallel_tests 5.x)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          PARALLEL_TESTS_VERSION: "~> 5.0"
        run: task test:features:ruby-parallel

  ruby-parallel-baseline:
    # H7 diagnostic (PR #100): does `parallel_rspec spec` hang on GHA when
    # rspec-tracer is absent entirely? Same matrix, same runner image, same
    # Open3 harness — only the fixture differs. Revert together with the
    # sibling fixture once the signal is collected.
    name: ruby-parallel-baseline (ruby-${{ matrix.ruby }}, rspec-${{ matrix.rspec }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.matrix-config.outputs.rubies) }}
        rspec: ${{ fromJSON(needs.matrix-config.outputs.rspecs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Baseline (no rspec-tracer, parallel_tests 4.7)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          PARALLEL_TESTS_VERSION: "~> 4.7"
        run: task test:integration:parallel-baseline

      - name: Test — Baseline (no rspec-tracer, parallel_tests 5.x)
        env:
          RSPEC_VERSION: "~> ${{ matrix.rspec }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          PARALLEL_TESTS_VERSION: "~> 5.0"
        run: task test:integration:parallel-baseline

  rails:
    name: rails (ruby-${{ matrix.ruby }}, rails-${{ matrix.rails }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIMPLECOV_VERSION: "~> 0.22"
      BRANCH_COVERAGE: 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.rails_cells) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (Rails)
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec_rails }}.0"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
        run: task test:features:rails

  jruby:
    name: jruby
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools for JRuby native extensions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.matrix-config.outputs.jruby }}
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Features (JRuby)
        env:
          RSPEC_VERSION: "~> 3.13.0"
          SIMPLECOV_VERSION: "~> 0.22"
        run: task test:features:jruby

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Canonical benchmark cell: fix every ENV-driven fixture version at
    # the job level so `task benchmark:bundle` (which runs `bundle
    # install` inside spec/fixtures/rails_app) and the later
    # `rails db:test:prepare` step resolve against the same Rails
    # lockfile. A step-scoped env on the db:prepare step alone leaves
    # benchmark:bundle to pick up the Gemfile default (Rails 7.2.3.1+
    # since the activestorage CVE fix), which then conflicts with a
    # 7.1-pinned resolver run. Keeps the benchmark pinned to Rails
    # 7.1 for cross-run comparability regardless of the fixture's
    # default moving forward.
    env:
      RAILS_VERSION: "~> 7.1.0"
      RSPEC_RAILS_VERSION: "~> 6.1.0"
      SIMPLECOV_VERSION: "~> 0.22"
      SQLITE3_VERSION: "~> 1.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Canonical benchmark cell — comparing across Rubies adds noise
          # without signal, so pin to the .ruby-version floor.
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Fixture bundles are fetched fresh on every run by default -
      # setup-ruby's bundler-cache only keys on the outer project's
      # Gemfile.lock. Cache each fixture's vendor/bundle dir
      # separately so repeat runs reuse the downloaded gems. Key
      # includes the Gemfile hash and the Ruby version file so a
      # toolchain bump invalidates the cache.
      - name: Cache benchmark ruby_app fixture bundle
        uses: actions/cache@v4
        with:
          path: benchmark/fixtures/ruby_app/vendor/bundle
          key: fixture-bundle-ruby-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('benchmark/fixtures/ruby_app/Gemfile') }}
          restore-keys: |
            fixture-bundle-ruby-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-

      # The Rails fixture Gemfile branches on RAILS_VERSION /
      # RSPEC_RAILS_VERSION / SQLITE3_VERSION at resolve time, so the
      # cache key must include them to avoid serving a stale set when
      # the matrix pin moves. SIMPLECOV_VERSION does not change the
      # resolver path today but is included for parity with the env
      # the fixture actually sees.
      - name: Cache rails_app fixture bundle
        uses: actions/cache@v4
        with:
          path: spec/fixtures/rails_app/vendor/bundle
          # Folded scalar: line breaks land inside `${{ }}` so the
          # inserted whitespace is harmless to the expression parser;
          # the evaluated cache key contains no internal spaces.
          key: >-
            fixture-bundle-rails-app-${{ runner.os
            }}-${{ hashFiles('.ruby-version')
            }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile')
            }}-${{ env.RAILS_VERSION
            }}-${{ env.RSPEC_RAILS_VERSION
            }}-${{ env.SIMPLECOV_VERSION
            }}-${{ env.SQLITE3_VERSION }}
          restore-keys: |
            fixture-bundle-rails-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile') }}-
            fixture-bundle-rails-app-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-

      # `bundle config set --local` writes to each fixture's
      # .bundle/config (gitignored), scoping the path redirect to
      # that Gemfile's context. Outer-project bundle commands stay on
      # the setup-ruby-managed path.
      - name: Point fixture bundler at vendor/bundle
        run: |
          (cd benchmark/fixtures/ruby_app && bundle config set --local path vendor/bundle)
          (cd spec/fixtures/rails_app && bundle config set --local path vendor/bundle)

      - name: Install fixture bundles
        run: task benchmark:bundle

      - name: Prepare Rails fixture database
        run: bundle exec rails db:test:prepare
        working-directory: spec/fixtures/rails_app

      - name: Benchmark — full (no enforcement; CI baseline not yet committed)
        # Ratchet file was generated on Apple M2 Max; GHA ubuntu-latest
        # (2-core VMs) runs 3-5× slower, so enforcement would always
        # fail. See benchmark/README.md for the CI-baseline followup.
        run: |
          ruby benchmark/harness.rb --full \
            --ratchet benchmark/ratchet.json \
            --no-enforce \
            --summary-md benchmark/ci-summary.md

      - name: Upload benchmark summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmark/ci-summary.md
          if-no-files-found: error
