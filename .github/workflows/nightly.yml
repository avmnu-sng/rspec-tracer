---
name: nightly

on:
  schedule:
    # Every day at 02:00 UTC — catches upstream patch regressions that land
    # outside our commit stream (e.g., a new Rails 7.x patch breaking us).
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-specs:
    name: lint-and-specs
    uses: ./.github/workflows/lint-and-specs.yml
    secrets: inherit

  full-matrix:
    name: full-matrix
    uses: ./.github/workflows/full-matrix.yml
    secrets: inherit

  fuzz-and-mutation:
    name: fuzz-and-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Mutation requires MRI >= 3.2; pin to .ruby-version (3.3.10).
          ruby-version: '.ruby-version'
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test — Fuzz (full, 10000 iterations)
        run: task test:fuzz:full

      - name: Test — Mutation (full, whole TimeFormatter module)
        run: task test:mutation:full
