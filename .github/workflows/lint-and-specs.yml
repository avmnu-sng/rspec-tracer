---
name: lint-and-specs

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint — Ruby
        run: task lint:ruby
      - name: Lint — Actions
        run: task lint:actions
      - name: Lint — YAML
        run: task lint:yaml
      - name: Lint — Node (HTML reporter frontend)
        run: task lint:node
      - name: Check — Bundle
        run: task check:bundle
      - name: Check — HTML reporter dist drift
        run: task reporters:html:check

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Security — bundle-audit
        run: task security:bundle-audit
      - name: Security — npm audit (HTML reporter)
        run: npm audit --audit-level=high
        working-directory: lib/rspec_tracer/reporters/html
      - name: Security — trivy
        run: task security:trivy

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Unit
        run: task test:unit
      - name: Test — Property
        run: task test:property
      - name: Test — Dogfood
        run: task test:dogfood

  test-edge-cases:
    name: test-edge-cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Edge cases
        run: task test:edge-cases

  test-fuzz:
    name: test-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Fuzz (full, 10000 iterations across 3 harnesses)
        run: task test:fuzz:full

  test-mutation-smoke:
    name: test-mutation-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (smoke)
        run: task test:mutation:smoke

  test-mutation-tracker:
    name: test-mutation-tracker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (tracker)
        run: task test:mutation:tracker

  test-mutation-storage:
    name: test-mutation-storage
    # SqliteBackend mutation pass dominates wall clock; ~30 min on M2
    # Max, 1.4-1.6x slower on ubuntu-latest. 60 min headroom keeps
    # this job from timing out under GHA scheduling jitter.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (storage)
        run: task test:mutation:storage

  test-mutation-rspec:
    name: test-mutation-rspec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (rspec)
        run: task test:mutation:rspec

  test-mutation-top-level:
    name: test-mutation-top-level
    runs-on: ubuntu-latest
    # Bumped 15 -> 30 after PR #122's merge-to-main run cancelled at
    # 15:02 wall clock (PR #122 itself ran at 14:52, 8s under the cap).
    # The mutation pass succeeds (Coverage 99.71% >= 85%) but pegs
    # runtime at ~14:30 because most RSpecTracer.* methods are called
    # during spec-helper setup; mutations cause the spec process to
    # hang and get killed via mutant's per-mutation 5s timeout (674
    # of 707 mutations land as Timeouts). Post-job cache cleanup adds
    # the last few seconds, and any CI jitter pushes the job over the
    # 15 min cap. 30 min matches test-mutation-tracker / -rspec and
    # gives headroom without changing behavior - jobs end when work
    # ends, the timeout is a hard cap.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (top-level)
        run: task test:mutation:top-level

  test-mutation-remote-cache:
    name: test-mutation-remote-cache
    # Mutation pass on lib/rspec_tracer/remote_cache/ (8 subjects).
    # S3Backend at ~567 LOC + 47 mutant subjects is the bulk; sized
    # comparable to test-mutation-storage's SqliteBackend (581 LOC).
    # Per-subject gates carve out the structural describe-label
    # ceiling (see Taskfile inline rationale). 60 min headroom matches
    # storage's bottleneck.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (remote-cache)
        run: task test:mutation:remote-cache

  test-mutation-rails:
    name: test-mutation-rails
    # Mutation pass on lib/rspec_tracer/rails/ (3 net-new subjects:
    # Notifications, I18nTracking, Railtie; Preset already in smoke).
    # Smaller surface than storage / remote-cache; 30 min cap matches
    # tracker / rspec / top-level. Carve-outs documented inline in the
    # Taskfile gate for combined-describe + Module#prepend ceilings.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (rails)
        run: task test:mutation:rails

  test-mutation-reporters:
    name: test-mutation-reporters
    # Mutation pass on lib/rspec_tracer/reporters/ (6 subjects: Base,
    # JsonReporter, TerminalReporter, HtmlReporter, PayloadBuilder,
    # Registry). HtmlReporter at 218 LOC + PayloadBuilder at 203 LOC
    # carry the bulk; 60 min headroom matches storage / remote-cache
    # bottlenecks. Carve-outs sized for prose-form integration describe
    # ceilings - see Taskfile inline rationale.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test — Mutation (reporters)
        run: task test:mutation:reporters

  test-integration-remote:
    name: test-integration-remote
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # LocalStack provides a real S3 API surface for the M7.1 remote-cache
      # integration spec. We pin a specific image tag so a LocalStack
      # release never silently breaks our CI. The `task ci:localstack:ready`
      # step below layers a health-poll + smoke probe on top of the
      # container health check before any spec runs.
      localstack:
        image: localstack/localstack:4.14.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEBUG: '0'
        options: >-
          --health-cmd "curl -sSf http://localhost:4566/_localstack/health | grep -q '\"s3\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Redis provides the real wire surface for the M7.2 RedisBackend
      # integration spec. 7.4 is the current stable; pin the minor to
      # keep CI reproducible across Redis's periodic protocol tweaks.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install — awslocal (LocalStack CLI wrapper)
        run: pip install --user awscli-local
      - name: Install — redis-cli (for health probe + local smoke)
        run: sudo apt-get install -y --no-install-recommends redis-tools
      - name: Wait — LocalStack ready + smoke probe
        run: task ci:localstack:ready
      - name: Test — Integration (remote cache + LocalStack)
        run: task test:integration:remote-cache
      - name: Wait — Redis ready + smoke probe
        env:
          REDIS_URL: redis://localhost:6379/15
        run: task ci:redis:ready
      - name: Test — Integration (remote cache + Redis)
        env:
          REDIS_URL: redis://localhost:6379/15
        run: task test:integration:remote-cache:redis

  # Consolidator: the single required-status-check that branch
  # protection can gate on. Succeeds iff every parallel job above
  # succeeded; if any fails or is cancelled, GitHub blocks this
  # job from running and the overall workflow status is failure.
  # The original sequential `lint-and-specs / lint-and-specs` job
  # name retired in favor of `lint-and-specs / lint-and-specs` here.
  lint-and-specs:
    name: lint-and-specs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - security
      - test-unit
      - test-edge-cases
      - test-fuzz
      - test-mutation-smoke
      - test-mutation-tracker
      - test-mutation-storage
      - test-mutation-rspec
      - test-mutation-top-level
      - test-mutation-remote-cache
      - test-mutation-rails
      - test-mutation-reporters
      - test-integration-remote
    steps:
      - name: Consolidate
        run: |
          echo "All parallel lint-and-specs jobs passed."
