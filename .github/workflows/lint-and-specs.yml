---
name: lint-and-specs

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  lint-and-specs:
    name: lint-and-specs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache out-of-bundle tools
        uses: actions/cache@v5
        with:
          path: |
            bin
            .venv
          key: tools-${{ runner.os }}-${{ hashFiles('Taskfile.yml', '.tool-versions') }}

      - name: Install tools
        run: task install:tools

      - name: Ensure tool paths
        run: |
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Lint — Ruby
        run: task lint:ruby

      - name: Lint — Actions
        run: task lint:actions

      - name: Lint — YAML
        run: task lint:yaml

      - name: Check — Bundle
        run: task check:bundle

      - name: Security — bundle-audit
        run: task security:bundle-audit

      - name: Security — trivy
        run: task security:trivy

      - name: Test — Unit
        run: task test:unit
