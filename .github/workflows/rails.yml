name: rails

on:
  push:
    branches: [ '1.0-stable' ]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}-rails
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: rails-group-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Rails × Ruby × rspec-rails compatibility pairs. Rails 6.1 is
        # the last that installs on Ruby 2.5 / 2.6; Rails 7.x requires
        # Ruby 2.7+. rspec-rails 5 works on Ruby 2.5+ with Rails 6.x;
        # rspec-rails 6 requires Ruby 2.7+ for Rails 7.x.
        include:
          - { group: 1,  ruby: '2.5', rails: '6.1', rspec-rails: '5.0', sqlite3: '1.4', puma: '5.0' }
          - { group: 2,  ruby: '2.6', rails: '6.1', rspec-rails: '5.0', sqlite3: '1.4', puma: '5.0' }
          - { group: 3,  ruby: '2.7', rails: '6.1', rspec-rails: '5.0', sqlite3: '1.4', puma: '5.0' }
          - { group: 4,  ruby: '3.0', rails: '6.1', rspec-rails: '5.0', sqlite3: '1.4', puma: '5.0' }
          - { group: 5,  ruby: '3.0', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4', puma: '5.0' }
          - { group: 6,  ruby: '3.1', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4', puma: '5.0' }
          - { group: 7,  ruby: '3.2', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4', puma: '5.0' }
          - { group: 8,  ruby: '3.3', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4', puma: '5.0' }
          - { group: 9,  ruby: '3.2', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4', puma: '6.0' }
          - { group: 10, ruby: '3.3', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4', puma: '6.0' }
          - { group: 11, ruby: '3.4', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4', puma: '6.0' }
          - { group: 12, ruby: '4.0', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4', puma: '6.0' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Pin Bundler 2.3.27
        run: gem install bundler -v 2.3.27 --no-document

      - name: Bundle install
        run: bundle _2.3.27_ install --jobs 4 --retry 3

      - name: Run Features
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec-rails }}.0"
          SIMPLECOV_VERSION: '~> 0.21.0'
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
          PUMA_VERSION: "~> ${{ matrix.puma }}"
        run: bundle _2.3.27_ exec cucumber --retry 3 --no-strict-flaky --tags @rails-app
