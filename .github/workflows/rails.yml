name: rails

on:
  push:
    branches: [ 'main' ]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}-rails
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: rails-group-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Rails 8.0 is planned once the reference Rails app is rebuilt.
        include:
          - { group: 1,  ruby: '3.1', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 2,  ruby: '3.1', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 3,  ruby: '3.1', rails: '7.2', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 4,  ruby: '3.2', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 5,  ruby: '3.2', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 6,  ruby: '3.2', rails: '7.2', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 7,  ruby: '3.3', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 8,  ruby: '3.3', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 9,  ruby: '3.3', rails: '7.2', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 10, ruby: '3.4', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 11, ruby: '3.4', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 12, ruby: '3.4', rails: '7.2', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 13, ruby: '4.0', rails: '7.0', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 14, ruby: '4.0', rails: '7.1', rspec-rails: '6.1', sqlite3: '1.4' }
          - { group: 15, ruby: '4.0', rails: '7.2', rspec-rails: '6.1', sqlite3: '1.4' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run Features
        env:
          RAILS_VERSION: "~> ${{ matrix.rails }}.0"
          RSPEC_RAILS_VERSION: "~> ${{ matrix.rspec-rails }}.0"
          SIMPLECOV_VERSION: "~> 0.22"
          SQLITE3_VERSION: "~> ${{ matrix.sqlite3 }}"
          BRANCH_COVERAGE: "true"
        run: bundle exec cucumber --retry 1 --no-strict-flaky --tags @rails-app
