name: spec

on:
  push:
    branches: [ 'main' ]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}-spec
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: spec-group-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: 1, ruby: '3.1' }
          - { group: 2, ruby: '3.2' }
          - { group: 3, ruby: '3.3' }
          - { group: 4, ruby: '3.4' }
          - { group: 5, ruby: '4.0' }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec
