---
name: soak

# Nightly 100-iter soak against spec/fixtures/rails_app_big/ (4x clone
# of rails_app, 1208 examples). Subprocess per iter, deterministic-
# seeded random file mutation rotation through 9 kinds, asserts
# memstat[N].total_memsize <= memstat[5].total_memsize * 1.05 for
# N >= 6.
#
# 03:00 UTC schedule keeps the run off-peak relative to per-PR CI
# wall clock + leaves the morning slot open for failure triage.
# Manual workflow_dispatch supports ad-hoc smoke runs from the
# Actions UI.
#
# timeout-minutes: 240 - 4 h cap = 50% margin under GHA's 6 h hard
# limit so the cache post-hook fires reliably even on cold-cache
# first run (per feedback_actions_cache_post_hook_timeout). Cron
# jobs that hit the 6 h limit get cancelled mid-step; the post-hook
# then skips and the cache silently fails to save.
#
# MRI-only per feedback_jruby_ci_subprocess_floor: JRuby x Rails
# 100-iter would compound to ~250 min wall clock per cell, untenable
# in nightly cadence.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: Iteration count override (default 100)
        required: false
        default: '100'

permissions:
  contents: read

concurrency:
  # One soak run at a time; later schedule firings cancel older
  # in-progress runs (rare with the nightly cadence + 4 h budget,
  # but a manual dispatch during a stuck run can wedge otherwise).
  group: soak
  cancel-in-progress: true

jobs:
  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RAILS_VERSION: "~> 7.1.0"
      RSPEC_RAILS_VERSION: "~> 6.1.0"
      SQLITE3_VERSION: "~> 1.4"
      SOAK_ITERATIONS: ${{ inputs.iterations || '100' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Cache the fixture's vendor/bundle so cold runs only pay once
      # for the Rails + rspec-rails + factory_bot_rails + sqlite3
      # gem set. Same key shape as full-matrix.yml's benchmark cell so
      # the soak can warm-share cache entries with that cell. The
      # source rails_app fixture and rails_app_big share the same
      # Gemfile (build_rails_app_big.rb copies it verbatim), so a
      # rails_app cache entry restores cleanly into rails_app_big.
      - name: Cache rails_app_big fixture bundle
        uses: actions/cache@v5
        with:
          path: spec/fixtures/rails_app_big/vendor/bundle
          key: >-
            fixture-bundle-rails-app-big-${{ runner.os
            }}-${{ hashFiles('.ruby-version')
            }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile')
            }}-${{ env.RAILS_VERSION
            }}-${{ env.RSPEC_RAILS_VERSION
            }}-${{ env.SQLITE3_VERSION }}
          restore-keys: |
            fixture-bundle-rails-app-big-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile') }}-
            fixture-bundle-rails-app-big-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-

      - name: Build rails_app_big fixture
        run: ruby scripts/build_rails_app_big.rb

      - name: Point fixture bundler at vendor/bundle
        run: |
          (cd spec/fixtures/rails_app_big && bundle config set --local path vendor/bundle)

      - name: Install fixture bundle
        run: |
          cd spec/fixtures/rails_app_big
          bundle install --jobs 4

      - name: Prepare Rails fixture database
        run: bundle exec rails db:test:prepare
        working-directory: spec/fixtures/rails_app_big

      - name: Run soak (${{ env.SOAK_ITERATIONS }} iterations)
        run: task soak:full

      # Always upload soak memstats - they're the diagnostic artifact
      # if the bound is violated AND useful as the SLI signal even on
      # passing runs (post-merge dashboard could plot growth ratio
      # over time).
      - name: Upload soak memstats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-memstats-${{ github.run_id }}
          path: tmp/soak/
          if-no-files-found: warn
          retention-days: 14
