---
name: soak

# Nightly soak across 3 pinned-SHA real-world Rails+RSpec projects:
# Solidus / Refinery / Spree. The matrix has 4 cells (solidus,
# refinery, spree-shard-1, spree-shard-2); Spree is sharded because
# its core suite is too large to complete 50 iters under the 4 h cap
# on GHA EPYC (see strategy.matrix comment below). Each cell runs in
# parallel under fail-fast: false so one cell's failure doesn't cancel
# the others. Per-cell timeout-minutes: 240 (4 h cap = 50% margin
# under GHA's 6 h hard limit so the cache post-hook fires reliably
# even on cold-cache first run, per
# feedback_actions_cache_post_hook_timeout).
#
# 03:00 UTC schedule keeps the run off-peak relative to per-PR CI
# wall clock + leaves the morning slot open for failure triage.
# The companion soak-bump.yml cron (Mondays 04:00 UTC) reports pin
# drift but never auto-bumps; humans review the report and open
# bump PRs by hand.
#
# Pin files live at .github/sha-pins/<project>.txt holding three
# fields (sha=, tag=, license_sha256=). The "Read pin" step parses
# the sha into the matrix cell's checkout ref + cache key. License
# stability is checked by soak-bump.yml, not here.
#
# MRI-only per feedback_jruby_ci_subprocess_floor: JRuby x Rails
# multi-iter cells would compound to multiple hours each, untenable
# in nightly cadence.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: >-
          Iter count override per CELL (default per-project;
          solidus=50/refinery=100/spree=20 per shard, 2 shards = 40 total).
        required: false
        default: ''

permissions:
  contents: read

jobs:
  soak:
    name: soak (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # Independent per-cell entries - one cell's failure must not
      # cancel the others, otherwise the AC ("All soak cells complete
      # one cron run with no crash") is unverifiable on a bad night.
      #
      # Spree is sharded into 2 cells because its ~1307-example core
      # suite runs ~10-11 min/iter on GHA EPYC; a single-cell 50-iter
      # design needed ~9 h wall (busted the 4 h cap). Each shard runs
      # ITERATIONS=20 (~3.7 h) and uses SOAK_SHARD={1,2} to pick a
      # disjoint slice of the deterministic mutation-seed space, so the
      # combined shards cover ~40 iter-equivalents (4.4 mutation-kind
      # cycles, 30 post-warmup memory observations across shards) - most
      # of what the original single-cell 50-iter design provided.
      # Solidus and Refinery still fit a single 4 h cell at their
      # default 50/100 iter counts.
      fail-fast: false
      matrix:
        include:
          - project: solidus
            repo: solidusio/solidus
            cell: solidus
          - project: refinery
            repo: refinery/refinerycms
            cell: refinery
          - project: spree
            repo: spree/spree
            cell: spree-shard-1
            shard: '1'
          - project: spree
            repo: spree/spree
            cell: spree-shard-2
            shard: '2'
    concurrency:
      # Per-cell group so a workflow_dispatch rerun of one cell doesn't
      # cancel the others mid-run. cancel-in-progress because a manual
      # dispatch during a stuck run should preempt the stuck one (rare
      # with 4 h cap + nightly cadence). Shard-aware so a Spree-shard-1
      # rerun doesn't cancel Spree-shard-2.
      group: soak-${{ matrix.cell }}
      cancel-in-progress: true
    env:
      SOAK_PROJECT: ${{ matrix.project }}
      # SOAK_SHARD passes the per-cell shard index to the spec; empty
      # for non-sharded cells (solidus, refinery), '1' / '2' for the
      # Spree shards. The spec computes
      # `SHARD_OFFSET = (SHARD - 1) * ITERATIONS` and uses
      # `global_iter = iter + SHARD_OFFSET` for mutation-RNG seeding so
      # shard 1 and shard 2 exercise disjoint mutation-seed slices.
      SOAK_SHARD: ${{ matrix.shard }}
      SOAK_FIXTURE_ROOT: ${{ github.workspace }}/tmp/soak-fixtures/${{ matrix.project }}
      # On `schedule:` triggers GitHub Actions populates `inputs.*`
      # with each input's default value, which here is `''`. That
      # propagates as the literal empty string to the env var, which
      # used to break the spec (`Integer("")` raised). The spec now
      # treats empty as "use default"; this comment is the trail of
      # the gotcha for future maintainers reading the YAML alone.
      SOAK_ITERATIONS: ${{ inputs.iterations }}
    steps:
      - name: Checkout rspec-tracer
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler: '4.0.10'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Image-processing backends for the realworld targets:
      # - libvips (Solidus's kt-paperclip via FFI; without it the
      #   product image specs LoadError on `libvips.so.42`).
      # - imagemagick (Refinery's dragonfly 1.4 shells out to
      #   `identify` for image.width/height; without it
      #   thumbnail_dimensions returns 0x0 silently and the
      #   image_spec assertions fail).
      # Both are listed as pre-installed in actions/runner-images
      # but explicit install removes the assumption + survives any
      # future image trimming. Spree doesn't need either but the
      # install is ~5 s, cheaper than per-cell branching.
      - name: Install image-processing libraries (libvips + imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips42t64 libvips-tools imagemagick

      - name: Read pin
        id: pin
        run: |
          pin_file=".github/sha-pins/${{ matrix.project }}.txt"
          sha=$(awk -F= '$1 == "sha" { print $2 }' "$pin_file")
          tag=$(awk -F= '$1 == "tag" { print $2 }' "$pin_file")
          if [ -z "$sha" ] || [ -z "$tag" ]; then
            echo "ERROR: pin file $pin_file missing sha or tag" >&2
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Pin: ${{ matrix.project }} @ $tag ($sha)"

      - name: Checkout ${{ matrix.project }} fixture
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: tmp/soak-fixtures/${{ matrix.project }}

      - name: Cache ${{ matrix.project }} fixture bundle
        uses: actions/cache@v5
        with:
          # Cache busts on pin SHA bump so a major version's gem set
          # doesn't contaminate the next major's resolve. Cross-project
          # keys can't collide because the project name is in the prefix.
          path: tmp/soak-fixtures/${{ matrix.project }}/vendor/bundle
          key: >-
            soak-${{ matrix.project }}-${{ runner.os
            }}-${{ hashFiles('.ruby-version')
            }}-${{ steps.pin.outputs.sha }}
          restore-keys: |
            soak-${{ matrix.project }}-${{ runner.os }}-${{ hashFiles('.ruby-version') }}-

      - name: Setup ${{ matrix.project }} fixture (inject + bundle + db prep)
        run: task soak:setup:${{ matrix.project }}

      - name: Run soak (${{ matrix.cell }})
        run: task soak:full:${{ matrix.project }}

      - name: Render soak summary
        # `if: always()` so failed cells still render their summary
        # (the soak spec's `ensure` block writes summary.md regardless
        # of whether the assertion raised). The summary is the
        # primary SLI surface for nightly runs — visible directly on
        # the run page via $GITHUB_STEP_SUMMARY without downloading
        # the memstats artifact.
        if: always()
        run: |
          summary="tmp/soak/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## soak (${{ matrix.cell }})"
              echo ""
              echo "**Result:** ❌ no summary written (cell exited before the soak spec's ensure block ran)."
              echo ""
              echo "See the \`Run soak\` step's logs for the early-exit cause."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload memstats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Artifact name must be unique across matrix cells in one run;
          # cell (vs project) disambiguates spree-shard-1 from spree-shard-2.
          # The artifact ships tmp/soak/ which now includes summary.json
          # (machine-readable) + summary.md (rendered to the run page
          # via $GITHUB_STEP_SUMMARY) alongside per-iter memstat-*.json.
          name: soak-memstats-${{ matrix.cell }}-${{ github.run_id }}
          path: tmp/soak/
          if-no-files-found: warn
          retention-days: 14
