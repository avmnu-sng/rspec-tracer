---
name: example-tracer-cache

# Copy-paste reference workflow showing how to persist rspec-tracer's
# on-disk cache (`rspec_tracer_cache/`) across CI runs using GitHub
# Actions' built-in cache. This is the same upload/download lifecycle
# documented under "Configuring CI" in the README, but using
# actions/cache@v5 as the storage substrate instead of an S3 bucket
# + the rspec_tracer:remote_cache:{download,upload} rake tasks.
#
# How rspec-tracer interacts with this:
#
#   1. The "Restore" step pulls a prior run's rspec_tracer_cache/
#      tree (or a prefix-match fallback) into the fixture directory.
#      Cold first run = miss, populates after the suite finishes.
#   2. `task fixtures:rails:rspec` boots RSpecTracer.start, which
#      reads last_run.json + <run_id>/ subdirs from that restored
#      tree, and decides per-example whether dependencies have
#      shifted (run) or are unchanged (skip).
#   3. The post-step save (built into actions/cache@v5) writes the
#      freshly-updated rspec_tracer_cache/ tree back under the same
#      key for the next run to restore.
#
# Trigger shape: workflow_dispatch + a path-filtered push so the
# demo only auto-fires when the workflow file itself changes (the
# merge that lands this file is the cold-cycle bootstrap; subsequent
# manual workflow_dispatch firings exercise the warm cycle). The
# demo is NOT wired to per-PR CI - it's documentation, not a gate.

on:
  workflow_dispatch:
  push:
    # NOTE: the m8.4-d/* branch entry is a temporary debug aid to
    # exercise the cold-then-warm cycle on this PR's branch before
    # merge - reverted in the final commit before merging the PR
    # (matches the pull_request: pattern used in PR #137 / e1c3214).
    branches: [main, m8.4-d/cache-pattern-demo-workflow]
    paths:
      - .github/workflows/example-tracer-cache.yml

permissions:
  contents: read

concurrency:
  group: example-tracer-cache
  cancel-in-progress: true

jobs:
  demo:
    name: cache cold->warm cycle
    runs-on: ubuntu-latest
    # 30 min comfortably exceeds the cold-cache wall clock so the
    # post-step cache save fires on the first run. actions/cache@v5
    # only saves on successful job completion - if a tight cap
    # cancels the cold run, no cache is written and the next run is
    # also cold (nothing to restore from).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore rspec_tracer_cache/ from a prior run.
      #
      # Cache key composition (in order):
      #   1. runner.os                          - native gem/extension binaries
      #                                            differ across Linux/macOS;
      #                                            cache contents are not
      #                                            portable across them.
      #   2. hashFiles('.ruby-version')         - Ruby ABI / native-extension
      #                                            binary compatibility line.
      #   3. hashFiles('lib/rspec_tracer/version.rb')
      #                                         - tracer cache schema is keyed
      #                                            on the tracer version; a
      #                                            tracer upgrade that shifts
      #                                            schema must invalidate.
      #   4. hashFiles('spec/fixtures/rails_app/Gemfile')
      #                                         - the project Gemfile pins the
      #                                            input set the tracer hashes;
      #                                            edits here are the most
      #                                            common reason a previously-
      #                                            populated cache is out of
      #                                            date for skip decisions.
      #
      # restore-keys progressively trims trailing components so a
      # tracer-version bump or a Gemfile edit still warm-starts from
      # the closest prior shape. The tracer's own per-example input
      # digesting re-validates anything restored from a non-exact
      # match, so a partial-match restore is a hit-rate optimization
      # rather than a correctness contract.
      #
      # Note: spec/fixtures/rails_app/Gemfile.lock is not committed
      # (regenerated by `bundle install`), so it cannot participate
      # in the key. Transitive lockfile drift within the same
      # Gemfile requirement strings is therefore caught by the
      # tracer's input digesting on the next run, not by key
      # invalidation.
      - name: Restore rspec-tracer cache
        uses: actions/cache@v5
        with:
          path: spec/fixtures/rails_app/rspec_tracer_cache
          key: >-
            ${{ runner.os
            }}-${{ hashFiles('.ruby-version')
            }}-${{ hashFiles('lib/rspec_tracer/version.rb')
            }}-${{ hashFiles('spec/fixtures/rails_app/Gemfile')
            }}-rspec-tracer-cache
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('.ruby-version') }}-${{ hashFiles('lib/rspec_tracer/version.rb') }}-
            ${{ runner.os }}-${{ hashFiles('.ruby-version') }}-
            ${{ runner.os }}-

      # The fixture's spec/rails_helper.rb gates `require 'rspec_tracer';
      # RSpecTracer.start` behind RSPEC_TRACER=1 because the same Rails
      # app is shared across multiple unrelated test consumers in this
      # repo (the integration matrix, the cold_rails_v2 benchmark, and
      # this demo). In your own project, rspec-tracer is normally loaded
      # unconditionally at the top of spec_helper.rb / rails_helper.rb,
      # so you would not need this env var.
      - name: Run the rspec-tracer-instrumented suite
        env:
          RSPEC_TRACER: '1'
        run: task fixtures:rails:rspec

      # Surface the cache-skip rate on the job summary so the
      # cold->warm cycle is visible at a glance:
      #
      #   - cold run: skipped_examples = 0   (no cache to skip from)
      #   - warm run: skipped_examples > 0 when no inputs shifted
      #
      # The full report (per-example run_reason: "No cache" /
      # "Files changed" / "Env changed" / etc.) lives in
      # rspec_tracer_report/index.html, which the artifact-upload
      # step preserves below.
      - name: Summarize cache-skip rate
        if: always()
        run: |
          report="spec/fixtures/rails_app/rspec_tracer_report/report.json"
          if [ ! -f "$report" ]; then
            echo "rspec-tracer report not found at $report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ruby -rjson <<'RUBY' >> "$GITHUB_STEP_SUMMARY"
          payload = JSON.parse(File.read('spec/fixtures/rails_app/rspec_tracer_report/report.json'))
          summary = payload.fetch('summary', {})
          total = summary.fetch('total_examples', 0)
          skipped = summary.fetch('skipped_examples', 0)
          pct = total.zero? ? 0 : (skipped * 100.0 / total).round(1)
          puts "## rspec-tracer cache cycle"
          puts
          puts "| Metric | Value |"
          puts "|---|---|"
          puts "| Total examples | #{total} |"
          puts "| Skipped (cache hit) | #{skipped} |"
          puts "| % cached | #{pct}% |"
          puts
          puts skipped.zero? ? "Cold run: cache miss; tracer cache is being populated for the next run." : "Warm run: tracer reused #{skipped} prior result(s) from the restored cache."
          RUBY

      - name: Upload rspec-tracer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-tracer-report-${{ github.run_id }}
          path: spec/fixtures/rails_app/rspec_tracer_report/
          if-no-files-found: warn
          retention-days: 14
