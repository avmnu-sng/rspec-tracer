---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Group per PR (cancel superseded force-pushes / amends) but per ref
  # for everything else (main pushes, tags, manual dispatch). Setting
  # cancel-in-progress only when the trigger is a pull_request keeps
  # main / merge runs running to completion - we want every commit on
  # main fully validated, never cancelled because a later commit
  # arrived. PRs still cancel their predecessors so iteration stays
  # fast.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tier:
    name: tier
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tier: ${{ steps.detect.outputs.tier }}
      mut_tracker: ${{ steps.detect.outputs.mut_tracker }}
      mut_storage: ${{ steps.detect.outputs.mut_storage }}
      mut_rspec: ${{ steps.detect.outputs.mut_rspec }}
      mut_top_level: ${{ steps.detect.outputs.mut_top_level }}
      mut_cli: ${{ steps.detect.outputs.mut_cli }}
      run_rails: ${{ steps.detect.outputs.run_rails }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change tier
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Per-subject mutation flags. When a PR's diff doesn't
          # touch a subject's lib/+spec/ surface, that subject's
          # mutation gate is skipped on the per-PR run — same coverage
          # signal still runs at merge-to-main (full-matrix path) and
          # weekly. The flags are bash booleans converted to 'true' /
          # 'false' strings at output time so lint-and-specs.yml's
          # workflow_call inputs can consume them as YAML booleans.
          # Cross-cutting safety net (rolled in below): touching
          # Gemfile / Gemfile.lock / .ruby-version / Taskfile.yml /
          # lib/rspec_tracer.rb / .github/workflows/* OR the
          # gemspec OR multiple subjects flips ALL subject flags
          # to true so a refactor that ripples across subjects can't
          # silently miss any one of them.
          MUT_TRACKER=0; MUT_STORAGE=0; MUT_RSPEC=0; MUT_TOP_LEVEL=0
          MUT_FORCE_ALL=0
          # Multi-tier granularity: gate the rails fixture cell
          # (the `rails:` job in full-matrix.yml) on tier=test as well
          # as tier=build, so spec-only PRs that touch the rails
          # fixture paths still run the full Rails matrix. Without
          # this, a spec/fixtures/rails_app edit in a docs-only PR
          # would skip full-matrix entirely.
          RUN_RAILS=0

          if [ "$EVENT" = "pull_request" ]; then
            FILES=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA")
          else
            # push to main / workflow_dispatch: always run everything.
            FILES=""
          fi

          if [ "$EVENT" != "pull_request" ]; then
            {
              echo "tier=build"
              echo "mut_tracker=true"
              echo "mut_storage=true"
              echo "mut_rspec=true"
              echo "mut_top_level=true"
              echo "mut_cli=true"
              echo "run_rails=false"
            } >> "$GITHUB_OUTPUT"
            echo "Non-PR event ($EVENT): tier=build (full matrix); all mutation subjects enabled"
            exit 0
          fi

          if [ -z "$FILES" ]; then
            # tier=skip skips lint-and-specs entirely — flag values
            # don't matter, but we emit 'false' for diagnostic clarity.
            {
              echo "tier=skip"
              echo "mut_tracker=false"
              echo "mut_storage=false"
              echo "mut_rspec=false"
              echo "mut_top_level=false"
              echo "mut_cli=false"
              echo "run_rails=false"
            } >> "$GITHUB_OUTPUT"
            echo "No changed files: tier=skip"
            exit 0
          fi

          TIER="skip"

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Per-subject mutation flags from lib/+spec/ paths.
            # `lib/rspec_tracer.rb` (the top-level file) flips
            # mut_top_level AND triggers FORCE_ALL since it's the
            # entry-point that other subjects consume.
            case "$f" in
              lib/rspec_tracer/tracker/*|spec/tracker/*)
                MUT_TRACKER=1
                ;;
              lib/rspec_tracer/storage/*|spec/storage/*)
                MUT_STORAGE=1
                ;;
              lib/rspec_tracer/rspec/*|spec/rspec/*)
                MUT_RSPEC=1
                ;;
              lib/rspec_tracer/configuration.rb|lib/rspec_tracer/version.rb|lib/rspec_tracer/errors.rb|lib/rspec_tracer/time_formatter.rb|spec/top_level/*|spec/configuration_spec.rb|spec/rspec_tracer_spec.rb)
                MUT_TOP_LEVEL=1
                ;;
              lib/rspec_tracer/cli.rb|lib/rspec_tracer/cli/*|spec/cli/*)
                MUT_CLI=1
                ;;
            esac

            # Cross-cutting safety net: any of the following forces
            # ALL subject flags to true. These are files whose change
            # could ripple across multiple subjects without showing
            # up in any subject's lib/+spec/ surface directly.
            case "$f" in
              Gemfile|Gemfile.lock|.ruby-version|.tool-versions|Taskfile.yml|*.gemspec|lib/rspec_tracer.rb|.github/workflows/*|.github/actions/*)
                MUT_FORCE_ALL=1
                ;;
            esac

            # run_rails: rails fixture cell is the `rails:` job in
            # full-matrix.yml driving spec/integration/rails_app_spec.rb +
            # narrow_ar_schema_spec.rb against spec/fixtures/rails_app.
            # A diff touching any of these paths warrants a full-matrix
            # rails run even on a tier=test PR (spec-only / docs-only) -
            # otherwise a fixture edit silently skips the only signal
            # that exercises it across the matrix.
            case "$f" in
              spec/fixtures/rails_app/*|spec/integration/rails_app_spec.rb|spec/integration/narrow_ar_schema_spec.rb|spec/support/fixture_bundle_helper.rb)
                RUN_RAILS=1
                ;;
            esac

            case "$f" in
              *.md|LICENSE|.gitignore|CODEOWNERS|readme_files/*|.github/FUNDING.yml|.github/ISSUE_TEMPLATE/*)
                # skip-tier files — don't upgrade TIER
                ;;
              lib/*|*.gemspec|bin/*|benchmark/*|.ruby-version|.tool-versions|Taskfile.yml|.github/workflows/*)
                # lib/ proper, version/tool pins, OR the CI definition itself —
                # the matrix must run when any of these change because they all
                # influence what the matrix does.
                TIER="build"
                ;;
              Gemfile|Gemfile.lock|.rubocop.yml|.yamllint.yml|.rspec|trivy.yaml)
                if [ "$TIER" != "build" ]; then
                  TIER="validate"
                fi
                ;;
              spec/*|features/*|support/*)
                if [ "$TIER" != "build" ] && [ "$TIER" != "validate" ]; then
                  TIER="test"
                fi
                ;;
              *)
                # any other file (scripts, config, unclassified) — at least lint.
                if [ "$TIER" = "skip" ]; then
                  TIER="lint"
                fi
                ;;
            esac
          done <<< "$FILES"

          # Multi-subject diff is also a cross-cutting signal — if a
          # PR touches 2+ subjects' lib/+spec/ surfaces we run all 5
          # (refactors often miss a subject otherwise).
          touched=$((MUT_TRACKER + MUT_STORAGE + MUT_RSPEC + MUT_TOP_LEVEL + MUT_CLI))
          if [ "$touched" -ge 2 ]; then
            MUT_FORCE_ALL=1
          fi

          if [ "$MUT_FORCE_ALL" = "1" ]; then
            MUT_TRACKER=1; MUT_STORAGE=1; MUT_RSPEC=1; MUT_TOP_LEVEL=1; MUT_CLI=1
          fi

          to_bool() { [ "$1" = "1" ] && echo "true" || echo "false"; }
          MT=$(to_bool "$MUT_TRACKER")
          MS=$(to_bool "$MUT_STORAGE")
          MR=$(to_bool "$MUT_RSPEC")
          MTL=$(to_bool "$MUT_TOP_LEVEL")
          MC=$(to_bool "$MUT_CLI")
          RR=$(to_bool "$RUN_RAILS")

          {
            echo "tier=${TIER}"
            echo "mut_tracker=${MT}"
            echo "mut_storage=${MS}"
            echo "mut_rspec=${MR}"
            echo "mut_top_level=${MTL}"
            echo "mut_cli=${MC}"
            echo "run_rails=${RR}"
          } >> "$GITHUB_OUTPUT"
          echo "Detected tier: ${TIER}"
          echo "Mutation subjects: tracker=${MT} storage=${MS} rspec=${MR} top_level=${MTL} cli=${MC} (force_all=${MUT_FORCE_ALL})"
          echo "Run rails fixture cell: ${RR}"
          echo "Changed files:"
          echo "$FILES"

  lint-and-specs:
    name: lint-and-specs
    needs: tier
    if: ${{ needs.tier.outputs.tier != 'skip' }}
    uses: ./.github/workflows/lint-and-specs.yml
    with:
      mut_tracker: ${{ needs.tier.outputs.mut_tracker == 'true' }}
      mut_storage: ${{ needs.tier.outputs.mut_storage == 'true' }}
      mut_rspec: ${{ needs.tier.outputs.mut_rspec == 'true' }}
      mut_top_level: ${{ needs.tier.outputs.mut_top_level == 'true' }}
      mut_cli: ${{ needs.tier.outputs.mut_cli == 'true' }}
    secrets: inherit

  full-matrix:
    name: full-matrix
    needs: [tier, lint-and-specs]
    # tier=build runs the full matrix; tier=test + run_rails=true
    # runs full-matrix in 'rails-only' mode (just the rails fixture
    # cell + matrix-config dep). The mode input gates non-rails jobs
    # inside full-matrix.yml.
    if: ${{ needs.tier.outputs.tier == 'build' || needs.tier.outputs.run_rails == 'true' }}
    uses: ./.github/workflows/full-matrix.yml
    with:
      mode: ${{ needs.tier.outputs.tier == 'build' && 'build' || 'rails-only' }}
    secrets: inherit

  benchmark-comment:
    name: benchmark-comment
    needs: full-matrix
    # Runs only on PRs and only after the reusable matrix finishes
    # (success OR failure — the benchmark job within full-matrix uses
    # --no-enforce so it won't fail the matrix unless setup breaks).
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.full-matrix.result == 'success' || needs.full-matrix.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark summary
        uses: actions/download-artifact@v8
        with:
          name: benchmark-summary
          path: benchmark-summary
        continue-on-error: true

      - name: Post benchmark PR comment
        if: hashFiles('benchmark-summary/ci-summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: benchmark
          path: benchmark-summary/ci-summary.md

  ci-done:
    name: ci-done
    needs: [tier, lint-and-specs, full-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report result
        env:
          TIER: ${{ needs.tier.outputs.tier }}
          TIER_RESULT: ${{ needs.tier.result }}
          LINT_RESULT: ${{ needs.lint-and-specs.result }}
          MATRIX_RESULT: ${{ needs.full-matrix.result }}
        run: |
          echo "tier=${TIER} (job result: ${TIER_RESULT})"
          echo "lint-and-specs=${LINT_RESULT}"
          echo "full-matrix=${MATRIX_RESULT}"

          if [ "$TIER_RESULT" != "success" ]; then
            echo "::error::tier job did not succeed"
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ] && [ "$LINT_RESULT" != "skipped" ]; then
            echo "::error::lint-and-specs failed (${LINT_RESULT})"
            exit 1
          fi
          if [ "$MATRIX_RESULT" != "success" ] && [ "$MATRIX_RESULT" != "skipped" ]; then
            echo "::error::full-matrix failed (${MATRIX_RESULT})"
            exit 1
          fi
          echo "ci-done: all required jobs succeeded or were intentionally skipped (tier=${TIER})"
