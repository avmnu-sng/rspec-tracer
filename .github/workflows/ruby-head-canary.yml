---
name: ruby-head-canary

# Non-gating weekly canary for the best-effort interpreter tier:
# CRuby head (nightly dev build) and TruffleRuby head. The project's
# support tier treats both as best-effort with no CI gate; this
# workflow gives that claim a real signal without gating anything.
# Both jobs are `continue-on-error: true` at the JOB level, so a red
# job never fails the run; each job's final step writes its outcome
# to $GITHUB_STEP_SUMMARY so failures are visible on the run page.
#
# Wednesdays 05:30 UTC: an off-peak slot distinct from the other
# scheduled workflows (combinations Sun 02:00, soak daily 03:00,
# soak-bump Mon 04:00, CodeQL Mon 09:23).
#
# workflow_dispatch enables ad-hoc runs from the Actions UI between
# scheduled runs. Note: `gh workflow run ruby-head-canary.yml` only
# resolves after this file lands on the default branch, because GitHub
# registers dispatchable workflows from the default branch only.
#
# Both interpreters install as prebuilt nightly binaries via
# ruby/setup-ruby (ruby/ruby-dev-builder and
# ruby/truffleruby-dev-builder), so setup costs seconds with no
# source build. Neither job pins Bundler or RSPEC_VERSION: a head canary
# should track the latest toolchain the same way it tracks the
# latest interpreter.
#
# The root Gemfile parses cleanly on dev-version Rubies: every
# `Gem::Version.new(RUBY_VERSION)` comparison handles suffixed
# strings like "3.6.0dev" (Gem::Version treats them as prerelease of
# the next release, which still satisfies the `>= 3.2` / `>= 3.3`
# floors for any head build), and the gemspec's
# `required_ruby_version '>= 3.1.0'` is satisfied by prerelease
# versions.

on:
  schedule:
    - cron: '30 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-head:
    name: ruby-head unit canary (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby (head)
        id: setup-ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: head
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Bundle: list resolved versions"
        run: bundle list

      - name: "Test: Unit"
        id: unit
        run: task test:unit

      - name: Report outcome to step summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup-ruby.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          {
            echo "## CRuby head canary (non-gating)"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| setup-ruby (head) | ${SETUP_OUTCOME} |"
            echo "| task test:unit | ${UNIT_OUTCOME} |"
            echo ""
            if command -v ruby >/dev/null 2>&1; then
              echo "Interpreter: \`$(ruby -v)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  truffleruby-head:
    # Runs the same task surface as full-matrix.yml's pinned
    # `truffleruby:` cell (features + edge cases) rather than
    # `task test:unit`; the full unit suite is only exercised on
    # MRI cells, so unit failures here would be engine noise, not
    # head signal. Benchmark smoke is intentionally omitted: a
    # weekly informational cell has no ratchet to feed.
    name: truffleruby-head canary (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby (truffleruby-head)
        id: setup-ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: truffleruby-head
          bundler-cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.45.4
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Bundle: list resolved versions"
        run: bundle list

      - name: "Test: Features (TruffleRuby)"
        id: features
        run: task test:features:truffleruby

      - name: "Test: Edge cases (concurrent_write + sqlite cases auto-skip)"
        id: edge-cases
        if: always() && steps.setup-ruby.outcome == 'success'
        run: task test:edge-cases

      - name: Report outcome to step summary
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup-ruby.outcome }}
          FEATURES_OUTCOME: ${{ steps.features.outcome }}
          EDGE_CASES_OUTCOME: ${{ steps.edge-cases.outcome }}
        run: |
          {
            echo "## TruffleRuby head canary (non-gating)"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| setup-ruby (truffleruby-head) | ${SETUP_OUTCOME} |"
            echo "| task test:features:truffleruby | ${FEATURES_OUTCOME} |"
            echo "| task test:edge-cases | ${EDGE_CASES_OUTCOME} |"
            echo ""
            if command -v ruby >/dev/null 2>&1; then
              echo "Interpreter: \`$(ruby -v)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
