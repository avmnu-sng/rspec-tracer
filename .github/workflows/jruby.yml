name: jruby

on:
  push:
    branches: [ 'main' ]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}-jruby
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: jruby
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools for JRuby native extensions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-9.4
          bundler-cache: true

      - name: Run Features
        env:
          RSPEC_VERSION: "~> 3.13.0"
          SIMPLECOV_VERSION: "~> 0.22"
        run: JRUBY_OPTS="--debug -X+O" bundle exec cucumber --retry 3 --no-strict-flaky --tags "@ruby-app and not @parallel-tests"
