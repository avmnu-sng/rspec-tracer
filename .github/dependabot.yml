# Dependabot configuration for rspec-tracer.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # `rspec-tracer.gemspec` declares `required_ruby_version >= 3.1.0`
    # and the CI matrix gates Ruby 3.1 / 3.2 / 3.3 / 3.4 / 4.0 + JRuby
    # 9.4. The upgrades below transitively require Ruby >= 3.2 or
    # >= 3.3, which would break Ruby 3.1 cells. Revisit when the
    # Ruby 3.1 floor is dropped.
    ignore:
      # parallel >= 2.0 requires Ruby >= 3.3.
      - dependency-name: "parallel"
        versions: [">= 2.0"]
      # erb >= 5.0 requires Ruby >= 3.2 (pulled transitively via
      # irb -> rdoc -> erb). Pinned to ~> 4.0 in the Gemfile;
      # ignore matching upgrade PRs.
      - dependency-name: "erb"
        versions: [">= 5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
