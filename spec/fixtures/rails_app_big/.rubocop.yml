---
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  Exclude:
    - "bin/**/*"
    - "db/migrate/*"
    - "db/schema.rb"
    - "config/boot.rb"
    - "config/puma.rb"
    - "log/**/*"
    - "tmp/**/*"
    - "storage/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"

RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 15

RSpec/NestedGroups:
  Max: 5

RSpec/DescribedClass:
  Enabled: false

# Rails scaffold idioms use params.require/permit — too noisy to flag.
Rails/SkipsModelValidations:
  Enabled: false
