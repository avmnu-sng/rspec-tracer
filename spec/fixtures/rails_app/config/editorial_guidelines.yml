---
# Editorial style guide — loaded directly via YAML.load_file, NOT via
# ActiveSupport::Notifications, NOT via Rails config.
# 1.x rspec-tracer's Coverage-only approach doesn't record this file as a
# dependency of specs that consume it. 2.0's I/O prepend hooks on YAML.load_file
# will.
tone:
  default: "informative"
  allowed:
    - "informative"
    - "conversational"
    - "technical"

length:
  post:
    min_words: 50
    max_words: 5000
  comment:
    max_words: 200

forbidden_words:
  - "spam"
  - "clickbait"
  - "lorem"

recommended_reading_level: "grade-9"
