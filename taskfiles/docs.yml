version: '3'

# Docs tasks: yard HTML generation + lightweight checks.
# Cross-file dep-free.

tasks:
  docs:yard:
    desc: >-
      Generate the YARD HTML documentation under doc/yard/. Reads
      .yardopts at repo root for source globs + extras (README,
      ARCHITECTURE, UPGRADING, CHANGELOG, ROADMAP).
    cmds:
      - bundle exec yard doc

  docs:yard:check:
    desc: >-
      Run yardoc with --no-output to confirm zero parse errors on
      the public API surface; CI-friendly (no HTML written, just
      validates parseability).
    cmds:
      - bundle exec yard doc --no-output

  docs:yard:stats:
    desc: >-
      Print YARD documentation coverage stats. Useful for tracking
      which public API methods still lack doc comments.
    cmds:
      - bundle exec yard stats --list-undoc

  docs:leak-check:
    desc: >-
      Scan every tracked file for internal planning vocabulary that
      must not ship in the public repo (milestone tags, private note
      names, local-only doc-tree paths), including split
      directory-tree renderings in Markdown. Exemptions live in
      .leakcheck-allow at the repo root; every entry needs a trailing
      justification comment. Nonzero exit on any unallowed hit.
    cmds:
      - ruby scripts/leak_check.rb

  docs:wcag:
    desc: >-
      Run WCAG 2.1 AA accessibility audit on the HTML reporter via
      axe-core. Requires Node + Chrome (auto-installs ChromeDriver
      via browser-driver-manager on first run).
      Generates rspec_tracer_report/ first if missing by running
      task test:features:rails.
    cmds:
      - test -f rspec_tracer_report/index.html || task test:features:rails
      - npx --yes @axe-core/cli "file://$(pwd)/rspec_tracer_report/index.html" --tags wcag2aa,wcag21aa --timeout 240

  docs:site:build:
    desc: >-
      Build the per-version docs payload (YARD HTML + sample HTML
      report) under doc/site/ for the docs-publish workflow to
      stage into a version-keyed subdir on the gh-pages branch.
      The root landing page (docs/site/index.html) + versions.json
      are managed separately by the workflow itself; they are NOT
      part of the per-version payload.
    cmds:
      - rm -rf doc/site
      - mkdir -p doc/site/yard doc/site/demo
      - bundle exec yard doc --output-dir doc/site/yard
      - test -f rspec_tracer_report/index.html || task test:features:rails
      - cp -r rspec_tracer_report/* doc/site/demo/

  docs:site:preview:
    desc: >-
      Build the docs site AND copy the landing page + a placeholder
      versions.json into doc/preview/ so you can open
      doc/preview/index.html DIRECTLY (no HTTP server needed) and
      verify the version-aware layout before pushing. The version
      data is inlined into index.html via the BEGIN_VERSIONS_DATA
      marker so file:// rendering works without fetch().
    cmds:
      - task: docs:site:build
      - rm -rf doc/preview
      - mkdir -p doc/preview/main
      - cp -r doc/site/yard doc/preview/main/
      - cp -r doc/site/demo doc/preview/main/
      - cp docs/site/index.html doc/preview/index.html
      - |
        cat > doc/preview/versions.json <<'EOF'
        {
          "schema_version": 1,
          "generated_at": "preview",
          "trigger": "preview",
          "latest_stable": null,
          "latest_prerelease": null,
          "all_versions": []
        }
        EOF
      - |
        python3 - <<'PY'
        import pathlib, re
        html_path = pathlib.Path('doc/preview/index.html')
        json_path = pathlib.Path('doc/preview/versions.json')
        html = html_path.read_text(encoding='utf-8')
        data = json_path.read_text(encoding='utf-8').strip()
        new_html, count = re.subn(
          r'/\* BEGIN_VERSIONS_DATA \*/.*?/\* END_VERSIONS_DATA \*/',
          '/* BEGIN_VERSIONS_DATA */ ' + data + ' /* END_VERSIONS_DATA */',
          html, count=1, flags=re.DOTALL,
        )
        if count == 0:
          raise SystemExit('BEGIN_VERSIONS_DATA marker missing from index.html')
        html_path.write_text(new_html, encoding='utf-8')
        print(f'inlined {len(data)} bytes of versions data into index.html')
        PY
      - echo "Preview ready. Open directly (no HTTP server needed):"
      - echo "  open doc/preview/index.html"
