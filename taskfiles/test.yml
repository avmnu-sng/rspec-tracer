version: '3'

# Test tasks (non-mutation, non-features): unit, contract, property,
# fuzz:smoke/full, integration*, edge-cases, dogfood, all/everything
# aggregators. test:integration:remote-cache* tasks depend on
# ci:localstack:ready / ci:redis:ready (in ci.yml) — resolved via
# flatten: true.

tasks:
  test:unit:
    desc: Unit tests (fast)
    cmds:
      - bundle exec rspec --fail-fast

  test:contract:
    desc: Contract tests (storage + remote cache backends)
    cmds:
      - bundle exec rspec spec/contracts

  test:integration:
    desc: >-
      Integration tests (ruby_app subprocess + dogfood + constants regression).
      Excludes rails_app (see `test:features:rails`) and parallel_tests (see
      `test:integration:parallel`) because both exceed the fast-feedback budget.
      Files listed explicitly: `.rspec`'s --exclude-pattern does not apply when
      positional paths are passed.
    cmds:
      - bundle exec rspec spec/integration/dogfood_spec.rb spec/integration/ruby_app_spec.rb spec/integration/constants_regression_spec.rb

  test:integration:check-bundle-drift:
    desc: >-
      M8.4-B drift task contract spec. Verifies
      scripts/check_bundle_drift.rb exits zero on a known-good
      Gemfile and non-zero on a fixture Gemfile with an
      unsatisfiable constraint. Excluded from the default rspec
      sweep (.rspec --exclude-pattern) because each `bundle install`
      shell-out takes ~10-30 s.
    cmds:
      - bundle exec rspec --no-color spec/integration/check_bundle_drift_spec.rb

  test:integration:parallel:
    desc: >-
      M5.1 parallel_tests integration test. Drives the benchmark ruby_app fixture
      under `parallel_rspec spec` and asserts the merged top-level cache shape.
      Excluded from the default rspec sweep (via .rspec --exclude-pattern) because
      each example spawns worker subprocesses.
    cmds:
      - bundle exec rspec --no-color spec/integration/parallel_tests_spec.rb

  test:property:
    desc: Property-based invariant tests
    cmds:
      - bundle exec rspec spec/properties

  test:fuzz:smoke:
    desc: >-
      Fuzz smoke — 100 iterations against each of the 3 fuzz harnesses
      (json_backend, multi-backend cache_loader, coverage_adapter).
    cmds:
      - ITERATIONS=100 bundle exec ruby spec/fuzz/json_backend_fuzz.rb
      - ITERATIONS=100 bundle exec ruby spec/fuzz/cache_loader_fuzz.rb
      - ITERATIONS=100 bundle exec ruby spec/fuzz/coverage_adapter_fuzz.rb

  test:fuzz:full:
    desc: >-
      Fuzz full — 10000 iterations against each of the 3 fuzz harnesses
      (json_backend, multi-backend cache_loader spread across :json /
      :msgpack / sqlite, coverage_adapter pathological shapes). Runs
      per-PR + per-main via `lint-and-specs.yml`'s `Test - Fuzz (full)`
      step (M3.8 Part C migration from the deleted nightly.yml).
    cmds:
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/json_backend_fuzz.rb
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/cache_loader_fuzz.rb
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/coverage_adapter_fuzz.rb

  test:edge-cases:
    desc: >-
      M8.2 edge case suite — adversarial filesystem + cache + concurrency
      tests under spec/edge_cases/. Excluded from the default rspec sweep
      via .rspec --exclude-pattern (memory: feedback_rspec_exclude_pattern_positional).
      Runs per-PR via lint-and-specs.yml's `Test - Edge cases` step.
    cmds:
      - bundle exec rspec --no-color spec/edge_cases

  test:dogfood:
    desc: Dogfood — run rspec-tracer against the benchmark ruby_app fixture, cold + warm
    cmds:
      - bundle exec rspec spec/integration/dogfood_spec.rb

  test:all:
    desc: Unit + contract + property (no integration — slow)
    cmds:
      - task: test:unit
      - task: test:contract
      - task: test:property

  test:everything:
    desc: Every test suite, including integration
    cmds:
      - task: test:all
      - task: test:integration

  # ── Cucumber features (legacy, removed in 2.0.0) ───────

  test:integration:per-example-dsl:
    desc: >-
      M5.2 per-example tracks DSL integration test. Drives the Rails fixture
      with a feature_flags_spec annotated with tracks: { env: ... }, cold/warm
      with the tracked env flipped, asserts only the env-branch examples
      re-run. Excluded from the default rspec sweep (subprocess, ~45s).
    cmds:
      - bundle exec rspec --no-color spec/integration/per_example_dsl_spec.rb

  test:integration:track-env-config:
    desc: >-
      M5.3 config-level track_env(*names) DSL + wildcard env matching.
      Drives the Rails fixture with a synthesized .rspec-tracer that
      declares `track_env 'AUTH_TOKEN'` (literal) or `track_env 'M53_PROBE_*'`
      (wildcard). Asserts every previously-seen example re-runs when a
      config-level tracked env flips, and that env_snapshot.json carries
      wildcard-expanded concrete keys (no pattern leakage). Excluded
      from the default rspec sweep (subprocess, multiple cold/warm cycles).
    cmds:
      - bundle exec rspec --no-color spec/integration/track_env_config_spec.rb

  test:integration:remote-cache:
    desc: >-
      M7.1 S3Backend integration test against LocalStack. End-to-end
      round-trip (upload + download + branch_refs + retention) against
      the real S3 API surface via awslocal. Excluded from the default
      rspec sweep. Depends on ci:localstack:ready so CI fails fast with
      a clear message if LocalStack is not reachable.
    deps: [ci:localstack:ready]
    cmds:
      - bundle exec rspec --no-color spec/integration/remote_cache_spec.rb

  test:integration:remote-cache:redis:
    desc: >-
      M7.2 RedisBackend integration test against a real Redis server.
      End-to-end round-trip (upload + download + branch_refs + retention
      + prune_all) against localhost:6379 (override via REDIS_URL).
      Depends on ci:redis:ready so CI fails fast if Redis is not reachable.
    deps: [ci:redis:ready]
    cmds:
      - bundle exec rspec --no-color spec/integration/remote_cache_redis_spec.rb
