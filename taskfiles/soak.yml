---
version: '3'

# Soak test tasks. Drive spec/soak/realworld_soak_spec.rb against
# pinned-SHA real-world Rails+RSpec projects (Solidus / Refinery /
# Spree) cloned into tmp/soak-fixtures/<project>/. The soak iterates
# subprocess runs of `bundle exec rspec`, deterministic-seeded random
# file mutation per iter (9-kind rotation), asserts memstat[N] <=
# memstat[5] * 1.05 for N >= 6.
#
# Pin files at .github/sha-pins/<project>.txt drive the pinned commit
# SHA + tag + license SHA-256. Bumps are review-gated: the
# soak-bump.yml weekly cron reports drift; humans open bump PRs
# manually.
#
# Local workflow:
#   task soak:fixture:<project>  # one-time clone + bundle + db prep
#   task soak:smoke:<project>    # 10 iters - pre-PR parity proxy
#   task soak:full:<project>     # full per-project iter count
#
# CI uses actions/checkout@v6 to clone the external project, then
# `task soak:setup:<project>` for post-checkout bundle + db prep,
# then `task soak:full:<project>` for the run.
#
# soak:fixture:all regenerates all 3 fixtures locally (sequential)
# for full pre-PR parity.
#
# MRI-only: JRuby x Rails cold-boots each subprocess in ~2:30 on CI
# runners, so multi-iter cells would compound past the 4 h cap.

vars:
  RSPEC_TRACER_ROOT:
    sh: pwd

tasks:
  soak:fixture:all:
    desc: >-
      Regenerate all 3 soak fixtures (solidus + refinery + spree).
      Idempotent. Use before a full pre-PR parity run.
    cmds:
      - task: soak:fixture:solidus
      - task: soak:fixture:refinery
      - task: soak:fixture:spree

  # -- Solidus ---------------------------------------------------

  soak:fixture:solidus:
    desc: >-
      Clone Solidus at the pinned SHA + bundle + db prep. Idempotent
      (skips git clone if directory exists; bundle check before
      install).
    cmds:
      - task: soak:_clone:solidus
      - task: soak:setup:solidus

  soak:_clone:solidus:
    internal: true
    cmds:
      - cmd: |
          mkdir -p tmp/soak-fixtures
          if [ ! -d tmp/soak-fixtures/solidus/.git ]; then
            sha=$(awk -F= '$1 == "sha" { print $2 }' .github/sha-pins/solidus.txt)
            git clone https://github.com/solidusio/solidus.git tmp/soak-fixtures/solidus
            git -C tmp/soak-fixtures/solidus checkout "$sha"
          fi

  soak:setup:solidus:
    desc: >-
      Inject rspec-tracer into Solidus Gemfile + bundle install +
      generate dummy_app for the api engine. Used both locally
      (after soak:_clone:solidus) and from the CI workflow (after
      actions/checkout@v6 of the external repo).
    cmds:
      - cmd: |
          cd tmp/soak-fixtures/solidus
          if ! grep -q "rspec-tracer" Gemfile; then
            printf '\n# soak-injected\ngem "rspec-tracer", path: "{{.RSPEC_TRACER_ROOT}}"\n' >> Gemfile
          fi
          bundle config set --local path vendor/bundle
          DB=sqlite bundle check >/dev/null 2>&1 || { rm -f Gemfile.lock; DB=sqlite bundle install --jobs 4; }
          # Generate the api engine's dummy_app (idempotent - rake
          # task no-ops if dummy already exists). Solidus's api/Rakefile
          # provides DummyApp::RakeTasks per-engine.
          if [ ! -d api/spec/dummy ]; then
            (cd api && DB=sqlite bundle exec rake test_app)
          fi

  soak:smoke:solidus:
    desc: >-
      10-iter Solidus soak (~10-15 min) for pre-PR parity. Auto-preps
      the fixture if missing. Mutations accumulate in
      tmp/soak-fixtures/solidus/ - rerun `task soak:fixture:solidus`
      after wiping the dir to reset.
    deps: [soak:fixture:solidus]
    env:
      SOAK_PROJECT: solidus
      SOAK_ITERATIONS: '10'
    cmds:
      - bundle exec rspec --no-color spec/soak/realworld_soak_spec.rb

  soak:full:solidus:
    desc: >-
      50-iter Solidus soak (~1.5-2 h) - cron driver. Drives the full
      memstat-vs-baseline gate.
    env:
      SOAK_PROJECT: solidus
    cmds:
      - bundle exec rspec --no-color spec/soak/realworld_soak_spec.rb

  # -- Refinery --------------------------------------------------

  soak:fixture:refinery:
    desc: >-
      Clone Refinery at the pinned SHA + bundle + dummy_app gen.
      Idempotent.
    cmds:
      - task: soak:_clone:refinery
      - task: soak:setup:refinery

  soak:_clone:refinery:
    internal: true
    cmds:
      - cmd: |
          mkdir -p tmp/soak-fixtures
          if [ ! -d tmp/soak-fixtures/refinery/.git ]; then
            sha=$(awk -F= '$1 == "sha" { print $2 }' .github/sha-pins/refinery.txt)
            git clone https://github.com/refinery/refinerycms.git tmp/soak-fixtures/refinery
            git -C tmp/soak-fixtures/refinery checkout "$sha"
          fi

  soak:setup:refinery:
    desc: >-
      Inject rspec-tracer into Refinery Gemfile + bundle install +
      generate the testing dummy_app via the refinery:testing
      Rake task. Used both locally and from CI.
    cmds:
      - cmd: |
          cd tmp/soak-fixtures/refinery
          if ! grep -q "rspec-tracer" Gemfile; then
            printf '\n# soak-injected\ngem "rspec-tracer", path: "{{.RSPEC_TRACER_ROOT}}"\n' >> Gemfile
          fi
          bundle config set --local path vendor/bundle
          # Unset CI for bundle install. Refinery main's Gemfile has
          # `if !ENV['CI']` gating for sqlite3. On GHA, ENV['CI']=true
          # so sqlite3 wouldn't be in the lockfile - but the soak
          # subprocess sets CI=>nil to delete the var entirely
          # (CI="" would still be truthy in Ruby), at which point
          # Bundler.setup re-evaluates the Gemfile and demands sqlite3,
          # finding it missing. Match the subprocess runtime by also
          # unsetting CI here.
          unset CI
          bundle check >/dev/null 2>&1 || { rm -f Gemfile.lock; bundle install --jobs 4; }
          if [ ! -d core/spec/dummy ] && [ ! -d spec/dummy ]; then
            bundle exec rake refinery:testing:dummy_app
          fi

  soak:smoke:refinery:
    desc: >-
      10-iter Refinery soak (~3-5 min) for pre-PR parity. Refinery
      is the smallest realworld target so smoke is fast.
    deps: [soak:fixture:refinery]
    env:
      SOAK_PROJECT: refinery
      SOAK_ITERATIONS: '10'
    cmds:
      - bundle exec rspec --no-color spec/soak/realworld_soak_spec.rb

  soak:full:refinery:
    desc: >-
      100-iter Refinery soak (~30-60 min) - cron driver. Higher iter
      count than Solidus/Spree because per-iter wall is shorter.
    env:
      SOAK_PROJECT: refinery
    cmds:
      - bundle exec rspec --no-color spec/soak/realworld_soak_spec.rb

  # -- Spree -----------------------------------------------------

  soak:fixture:spree:
    desc: >-
      Clone Spree at the pinned SHA + bundle + test_app gen.
      Idempotent.
    cmds:
      - task: soak:_clone:spree
      - task: soak:setup:spree

  soak:_clone:spree:
    internal: true
    cmds:
      - cmd: |
          mkdir -p tmp/soak-fixtures
          if [ ! -d tmp/soak-fixtures/spree/.git ]; then
            sha=$(awk -F= '$1 == "sha" { print $2 }' .github/sha-pins/spree.txt)
            git clone https://github.com/spree/spree.git tmp/soak-fixtures/spree
            git -C tmp/soak-fixtures/spree checkout "$sha"
          fi

  soak:setup:spree:
    desc: >-
      Inject rspec-tracer + the spree-umbrella gem (path '..') into
      spree/core/Gemfile + bundle install + generate test_app via
      core/Rakefile. The spree-umbrella gem provides the install
      generator that core/Rakefile's test_app task needs to migrate
      Spree's tables into the dummy DB; without it the dummy DB
      only has the placeholder spree_dummy_models table and lib
      specs fail with "Could not find table 'spree_taxonomies'".
      Used both locally and from CI.
    cmds:
      - cmd: |
          cd tmp/soak-fixtures/spree/spree/core
          if ! grep -q "rspec-tracer" Gemfile; then
            printf '\n# soak-injected\ngem "rspec-tracer", path: "{{.RSPEC_TRACER_ROOT}}"\n' >> Gemfile
          fi
          if ! grep -qE '^gem "spree", path: "\.\."' Gemfile; then
            printf 'gem "spree", path: ".."\n' >> Gemfile
          fi
          bundle config set --local path vendor/bundle
          # Unset CI so Spree's common_spree_dependencies.rb's
          # `gem 'mysql2' if ENV['CI']` / `gem 'pg' if ENV['CI']`
          # stay quiet. Subprocess runtime also has CI=>nil, so
          # this matches.
          unset CI
          DB=sqlite bundle check >/dev/null 2>&1 || { rm -f Gemfile.lock; DB=sqlite bundle install --jobs 4; }
          # Generate the core engine's dummy_app via core/Rakefile's
          # own test_app task (not spree/Rakefile's all-engines
          # iterator which aborts on `cannot load such file --
          # spree/emails` - emails is in SPREE_OPTIONAL_GEMS and we
          # don't bundle it).
          if [ ! -d spec/dummy ]; then
            DB=sqlite bundle exec rake test_app
          fi

  soak:smoke:spree:
    desc: >-
      10-iter Spree soak (~10-15 min) for pre-PR parity.
    deps: [soak:fixture:spree]
    env:
      SOAK_PROJECT: spree
      SOAK_ITERATIONS: '10'
    cmds:
      - bundle exec rspec --no-color spec/soak/realworld_soak_spec.rb

  soak:full:spree:
    desc: >-
      20-iter Spree soak per shard (~3.7 h on GHA) - cron driver.
      Locally on M2 Max each iter is ~1-2 min; on GHA `ubuntu-latest`
      EPYC each iter is ~10-11 min for Spree's ~1307-example core
      suite (3-6x Rails-heavy slowdown vs local). 20 iters per shard
      is the largest count that fits under the workflow's
      `timeout-minutes: 240` (4 h) cap with margin. The workflow shards
      Spree into 2 matrix cells (spree-shard-1, spree-shard-2) via the
      SOAK_SHARD env; combined the shards cover 40 iter-equivalents
      (4.4 mutation-kind cycles, 30 post-warmup memory observations
      across shards). The `workflow_dispatch.inputs.iterations` input
      overrides ITERATIONS per shard (applies to both shards).
      Unsharded local runs (`task soak:full:spree` without SOAK_SHARD)
      execute the 20-iter default with offset 0.
    env:
      SOAK_PROJECT: spree
    cmds:
      - bundle exec rspec --no-color spec/soak/realworld_soak_spec.rb
