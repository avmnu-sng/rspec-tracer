version: '3'

# Check tasks: bundle (Gemfile.lock installable), check (10s feedback
# loop: lint:ruby + test:unit + benchmark:smoke), all (aggregator).
# The check task depends on tasks from lint.yml + test.yml +
# benchmark.yml, resolved via flatten: true at root include time.

tasks:
  check:bundle:
    desc: Verify Gemfile.lock is installable
    cmds:
      - bundle check

  check:bundle:drift:
    desc: >-
      Verify every Gemfile in the repo resolves cleanly via a fresh
      `bundle install`. Outer Gemfile + rails_app fixture + benchmark
      ruby_app fixture. Original framing was "diff against committed
      Gemfile.lock" but every Gemfile.lock in this repo is gitignored
      (outer is library-style; fixtures are cross-interpreter). The
      meaningful drift signal is therefore "do these Gemfiles resolve
      cleanly on a fresh clone?" - which is what this task asserts.
      Each bundle install regenerates the gitignored lockfile from
      scratch; user's local lockfile state is unaffected since it's
      gitignored either way.
    cmds:
      - ruby scripts/check_bundle_drift.rb

  check:all:
    cmds:
      - task: check:bundle
      - task: check:bundle:drift

  # ── Tests ──────────────────────────────────────────────

  check:
    desc: 10-second feedback loop — lint + unit tests + smoke benchmark
    cmds:
      - task: lint:ruby
      - task: test:unit
      - task: benchmark:smoke

  # ── Full CI (local equivalent of CI pipeline) ──────────
