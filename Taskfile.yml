version: '3'

set: [errexit, nounset, pipefail]

# Per-concern task definitions live under taskfiles/. Each include
# uses `flatten: true` so the included file's tasks land at the root
# task namespace — e.g. taskfiles/lint.yml's `lint:ruby:` task is
# exposed as `lint:ruby` (the colon-segments inside the file's task
# name stay verbatim; no extra namespace prefix is added by the
# include). This preserves every existing `task <name>` invocation
# across CI workflows + docs without rename. Cross-file deps (e.g.
# test.yml's `test:integration:remote-cache` depending on ci.yml's
# `ci:localstack:ready`) resolve transparently because all tasks
# share the root namespace.
#
# Tool versions live at the root because they are cross-cutting:
# install:tools (setup.yml) downloads them, lint:* (lint.yml) /
# security:* (security.yml) consume them. Single source of truth.

vars:
  RUBY_VERSION:
    sh: cat .ruby-version
  VERSION:
    # -Ilib + -r avoids `require_relative` under `ruby -e`, which JRuby
    # can't resolve (LoadError: cannot infer basepath). Same pattern as
    # release.yml's tag-vs-VERSION check.
    sh: ruby -Ilib -rrspec_tracer/version -e 'puts RSpecTracer::VERSION'
  # Tool versions — bump intentionally, not accidentally.
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: v0.11.0
  YAMLLINT_VERSION: 1.37.1
  BUNDLER_AUDIT_VERSION: 0.9.2
  LICENSE_FINDER_VERSION: 7.2.1
  TRIVY_VERSION: v0.69.3
  # Stripped-v variants for `--version` output matching in install:tools'
  # status: guards (shellcheck reports `version: 0.11.0`, trivy reports
  # `Version: 0.69.3` — both omit the leading 'v' our pin uses).
  SHELLCHECK_VERSION_NUMBER:
    sh: echo "{{.SHELLCHECK_VERSION}}" | sed 's/^v//'
  TRIVY_VERSION_NUMBER:
    sh: echo "{{.TRIVY_VERSION}}" | sed 's/^v//'

includes:
  setup:
    taskfile: ./taskfiles/setup.yml
    flatten: true
  lint:
    taskfile: ./taskfiles/lint.yml
    flatten: true
  security:
    taskfile: ./taskfiles/security.yml
    flatten: true
  check:
    taskfile: ./taskfiles/check.yml
    flatten: true
  ci:
    taskfile: ./taskfiles/ci.yml
    flatten: true
  test:
    taskfile: ./taskfiles/test.yml
    flatten: true
  test-mutation:
    taskfile: ./taskfiles/test-mutation.yml
    flatten: true
  test-features:
    taskfile: ./taskfiles/test-features.yml
    flatten: true
  benchmark:
    taskfile: ./taskfiles/benchmark.yml
    flatten: true
  profile:
    taskfile: ./taskfiles/profile.yml
    flatten: true
  fixtures:
    taskfile: ./taskfiles/fixtures.yml
    flatten: true
  reporters:
    taskfile: ./taskfiles/reporters.yml
    flatten: true
  gem:
    taskfile: ./taskfiles/gem.yml
    flatten: true
  soak:
    taskfile: ./taskfiles/soak.yml
    flatten: true

tasks:
  default:
    silent: true
    cmds:
      - task --list
