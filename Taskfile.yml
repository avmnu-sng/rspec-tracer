version: '3'

set: [errexit, nounset, pipefail]

vars:
  RUBY_VERSION:
    sh: cat .ruby-version
  VERSION:
    # -Ilib + -r avoids `require_relative` under `ruby -e`, which JRuby
    # can't resolve (LoadError: cannot infer basepath). Same pattern as
    # release.yml's tag-vs-VERSION check.
    sh: ruby -Ilib -rrspec_tracer/version -e 'puts RSpecTracer::VERSION'
  # Tool versions — bump intentionally, not accidentally.
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: v0.11.0
  YAMLLINT_VERSION: 1.37.1
  BUNDLER_AUDIT_VERSION: 0.9.2
  LICENSE_FINDER_VERSION: 7.2.1
  TRIVY_VERSION: v0.69.3
  # Stripped-v variants for `--version` output matching in install:tools'
  # status: guards (shellcheck reports `version: 0.11.0`, trivy reports
  # `Version: 0.69.3` — both omit the leading 'v' our pin uses).
  SHELLCHECK_VERSION_NUMBER:
    sh: echo "{{.SHELLCHECK_VERSION}}" | sed 's/^v//'
  TRIVY_VERSION_NUMBER:
    sh: echo "{{.TRIVY_VERSION}}" | sed 's/^v//'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ── Setup ──────────────────────────────────────────────

  ruby:version-check:
    internal: true
    cmds:
      - |
        ACTUAL=$(ruby -e "puts RUBY_VERSION")
        if [ "$ACTUAL" != "{{.RUBY_VERSION}}" ]; then
          echo "Ruby version mismatch: expected {{.RUBY_VERSION}}, got $ACTUAL"
          echo "Run 'task install:ruby'"; exit 1
        fi

  install:ruby:
    desc: Install the Ruby version from .ruby-version via rbenv
    preconditions:
      - sh: command -v rbenv >/dev/null 2>&1
        msg: "rbenv not found; install: brew install rbenv"
    cmds:
      - rbenv install --skip-existing {{.RUBY_VERSION}}

  install:tools:
    desc: Install all pinned dev tools (binaries + yamllint venv + bundler-audit gem)
    # Everything lands under ./bin/ or ./.venv/ — no writes to system dirs,
    # no sudo, no PIPX_HOME gymnastics. Same install works on local Mac,
    # local Linux, and GHA runners.
    #   bin/actionlint, bin/shellcheck — direct curl + tar to ./bin/
    #   bin/yamllint                   — symlink to .venv/yamllint/bin/yamllint
    #   bundler-audit gem              — installed to the active Ruby's gem
    #                                    dir (setup-ruby handles PATH on CI;
    #                                    rbenv/asdf shims handle it locally)
    deps: [ruby:version-check]
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not found; install: 'brew install python@3.12' (mac) — Ubuntu ships it"
    # Status guards skip install when each binary is present AT THE
    # PINNED VERSION. M8.6 retro: previous `test -x` checks let cache
    # restore-keys hits (which may carry a stale binary from a prior
    # session with a different version pin) skip install incorrectly.
    # Version-aware grep against each tool's --version output ensures
    # a version bump in vars: above forces a re-install even when the
    # binary file already exists.
    status:
      - bin/actionlint -version 2>&1 | grep -qF '{{.ACTIONLINT_VERSION}}'
      - bin/shellcheck --version 2>&1 | grep -qF '{{.SHELLCHECK_VERSION_NUMBER}}'
      - bin/yamllint --version 2>&1 | grep -qF '{{.YAMLLINT_VERSION}}'
      - bin/trivy --version 2>&1 | grep -qF '{{.TRIVY_VERSION_NUMBER}}'
      - gem list -i bundler-audit --version {{.BUNDLER_AUDIT_VERSION}}
    cmds:
      - bundle install
      - |
        # actionlint: release naming uses amd64/arm64. `uname -m` on Linux
        # returns x86_64; on Apple Silicon returns arm64. Map both.
        #
        # Two-layer retry: inner curl `--retry 5` (covers ~10s of 5xx
        # blips) + outer 3-attempt loop with 5s/10s/20s exponential
        # backoff (covers ~35s of CDN unavailability). M8.3-A (PR #122)
        # / M8.3-B (PR #124) / M8.6 v5 (PR #129) all hit GitHub-Releases
        # 5xx flakes during cold-cache install:tools. Same outer-loop
        # shape was already on trivy install before M8.6 v3 bypassed
        # install.sh; M8.6 v5 retro promoted the pattern to actionlint
        # + shellcheck after a 6-consecutive-502 burst broke shellcheck.
        mkdir -p bin
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          aarch64|arm64) ARCH=arm64 ;;
          x86_64|amd64)  ARCH=amd64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        for attempt in 1 2 3; do
          set -o pipefail
          if curl --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused \
              -sSfL "https://github.com/rhysd/actionlint/releases/download/v{{.ACTIONLINT_VERSION}}/actionlint_{{.ACTIONLINT_VERSION}}_${OS}_${ARCH}.tar.gz" \
              | tar xz -C bin actionlint; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "ERROR: actionlint install failed after 3 attempts" >&2
            exit 1
          fi
          sleep_seconds=$((attempt * 5))
          echo "actionlint install attempt $attempt failed; retrying in ${sleep_seconds}s..." >&2
          sleep "$sleep_seconds"
        done
      - |
        # shellcheck: release naming uses x86_64/aarch64 (not amd64/arm64).
        # Same two-layer retry as actionlint above.
        mkdir -p bin
        VERSION={{.SHELLCHECK_VERSION}}
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          aarch64|arm64) ARCH=aarch64 ;;
          x86_64|amd64)  ARCH=x86_64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        for attempt in 1 2 3; do
          set -o pipefail
          if curl --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused \
              -sSfL "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/shellcheck-${VERSION}.${OS}.${ARCH}.tar.xz" \
              | tar xJ --strip-components=1 -C bin "shellcheck-${VERSION}/shellcheck"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "ERROR: shellcheck install failed after 3 attempts" >&2
            exit 1
          fi
          sleep_seconds=$((attempt * 5))
          echo "shellcheck install attempt $attempt failed; retrying in ${sleep_seconds}s..." >&2
          sleep "$sleep_seconds"
        done
      - |
        # yamllint: user-scoped venv under .venv/yamllint. Works identically
        # on local dev and GHA runners (pipx on GHA is pre-configured for
        # /opt/pipx system-wide, which non-sudo writes can't reach).
        # pip --retries 5 cushions against PyPI transients on cold cache.
        mkdir -p bin
        python3 -m venv .venv/yamllint
        .venv/yamllint/bin/pip install --quiet --disable-pip-version-check \
          --retries 5 "yamllint=={{.YAMLLINT_VERSION}}"
        ln -sf "$(pwd)/.venv/yamllint/bin/yamllint" bin/yamllint
      - |
        # trivy: direct binary download (matches actionlint/shellcheck
        # pattern). M8.6 retro: PR #129 first CI run had all 3 attempts
        # of the official install.sh wrapper fail in a 35s window —
        # install.sh shells out to its own curl + tar internally that
        # our outer retry can't see, so the loop just hits the same
        # GitHub-Releases CDN flake repeatedly. Direct curl with the
        # standard `--retry 5 --retry-all-errors --retry-connrefused`
        # gives us the same retry semantics as actionlint/shellcheck.
        # Same two-layer retry (inner curl --retry 5 + outer 3-attempt
        # loop) as actionlint/shellcheck since M8.6 v6. Trivy release
        # naming: trivy_<NUMBER>_<OS>-<ARCH>.tar.gz where NUMBER strips
        # the leading 'v' and ARCH uses 64bit/ARM64 (not x86_64/aarch64).
        mkdir -p bin
        VERSION={{.TRIVY_VERSION}}
        VERSION_NUMBER="${VERSION#v}"
        case "$(uname -s)" in
          Linux)  OS=Linux ;;
          Darwin) OS=macOS ;;
          *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          aarch64|arm64) ARCH=ARM64 ;;
          x86_64|amd64)  ARCH=64bit ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        for attempt in 1 2 3; do
          set -o pipefail
          if curl --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused \
              -sSfL "https://github.com/aquasecurity/trivy/releases/download/${VERSION}/trivy_${VERSION_NUMBER}_${OS}-${ARCH}.tar.gz" \
              | tar xz -C bin trivy; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "ERROR: trivy install failed after 3 attempts" >&2
            exit 1
          fi
          sleep_seconds=$((attempt * 5))
          echo "trivy install attempt $attempt failed; retrying in ${sleep_seconds}s..." >&2
          sleep "$sleep_seconds"
        done
      - gem install bundler-audit --version {{.BUNDLER_AUDIT_VERSION}} --no-doc

  # ── Lint ───────────────────────────────────────────────

  lint:ruby:
    desc: Run RuboCop (parallel)
    cmds:
      - bundle exec rubocop --parallel --format progress

  lint:actions:
    desc: Lint GitHub Actions workflows
    # actionlint shells out to `shellcheck` via Go's exec.LookPath,
    # which walks $PATH. On machines with goenv on PATH, its
    # shim directory (~/.goenv/shims/) precedes our bin/ and exposes
    # a shellcheck shim that errors unless a Go version currently has
    # shellcheck installed. Pin shellcheck to the project-installed
    # binary explicitly - any path with a slash bypasses PATH lookup.
    # Empty -pyflakes disables the Python lint pass we don't install.
    cmds:
      - bin/actionlint -shellcheck=./bin/shellcheck -pyflakes=

  lint:shell:
    desc: Lint shell scripts
    cmds:
      - |
        SCRIPTS=$(find . -name '*.sh' -not -path './.git/*' -not -path './tmp/*' -not -path './coverage/*' -not -path './rspec_tracer_*/*' 2>/dev/null || true)
        if [ -n "$SCRIPTS" ]; then
          echo "$SCRIPTS" | xargs bin/shellcheck
        else
          echo "No shell scripts to lint."
        fi

  lint:yaml:
    desc: Lint YAML files
    cmds:
      - bin/yamllint --strict .

  lint:node:
    desc: Lint + format check the HTML reporter frontend (ESLint + Prettier)
    dir: lib/rspec_tracer/reporters/html
    preconditions:
      - sh: test -d node_modules
        msg: "node_modules missing; run `task reporters:html:install` first"
    cmds:
      - npm run lint
      - npm run format

  lint:all:
    desc: Run every linter
    cmds:
      - task: lint:ruby
      - task: lint:actions
      - task: lint:shell
      - task: lint:yaml
      - task: lint:node

  # ── Checks (format / tidy) ─────────────────────────────

  check:bundle:
    desc: Verify Gemfile.lock is installable
    cmds:
      - bundle check

  check:all:
    cmds:
      - task: check:bundle

  # ── Tests ──────────────────────────────────────────────

  test:unit:
    desc: Unit tests (fast)
    cmds:
      - bundle exec rspec --fail-fast

  test:contract:
    desc: Contract tests (storage + remote cache backends)
    cmds:
      - bundle exec rspec spec/contracts

  test:integration:
    desc: >-
      Integration tests (ruby_app subprocess + dogfood + constants regression).
      Excludes rails_app (see `test:features:rails`) and parallel_tests (see
      `test:integration:parallel`) because both exceed the fast-feedback budget.
      Files listed explicitly: `.rspec`'s --exclude-pattern does not apply when
      positional paths are passed.
    cmds:
      - bundle exec rspec spec/integration/dogfood_spec.rb spec/integration/ruby_app_spec.rb spec/integration/constants_regression_spec.rb

  test:integration:parallel:
    desc: >-
      M5.1 parallel_tests integration test. Drives the benchmark ruby_app fixture
      under `parallel_rspec spec` and asserts the merged top-level cache shape.
      Excluded from the default rspec sweep (via .rspec --exclude-pattern) because
      each example spawns worker subprocesses.
    cmds:
      - bundle exec rspec --no-color spec/integration/parallel_tests_spec.rb

  test:property:
    desc: Property-based invariant tests
    cmds:
      - bundle exec rspec spec/properties

  test:fuzz:smoke:
    desc: >-
      Fuzz smoke — 100 iterations against each of the 3 fuzz harnesses
      (json_backend, multi-backend cache_loader, coverage_adapter).
    cmds:
      - ITERATIONS=100 bundle exec ruby spec/fuzz/json_backend_fuzz.rb
      - ITERATIONS=100 bundle exec ruby spec/fuzz/cache_loader_fuzz.rb
      - ITERATIONS=100 bundle exec ruby spec/fuzz/coverage_adapter_fuzz.rb

  test:fuzz:full:
    desc: >-
      Fuzz full — 10000 iterations against each of the 3 fuzz harnesses
      (json_backend, multi-backend cache_loader spread across :json /
      :msgpack / sqlite, coverage_adapter pathological shapes). Runs
      per-PR + per-main via `lint-and-specs.yml`'s `Test - Fuzz (full)`
      step (M3.8 Part C migration from the deleted nightly.yml).
    cmds:
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/json_backend_fuzz.rb
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/cache_loader_fuzz.rb
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/coverage_adapter_fuzz.rb

  test:edge-cases:
    desc: >-
      M8.2 edge case suite — adversarial filesystem + cache + concurrency
      tests under spec/edge_cases/. Excluded from the default rspec sweep
      via .rspec --exclude-pattern (memory: feedback_rspec_exclude_pattern_positional).
      Runs per-PR via lint-and-specs.yml's `Test - Edge cases` step.
    cmds:
      - bundle exec rspec --no-color spec/edge_cases

  test:mutation:smoke:
    desc: >-
      Mutation smoke — 13 subjects (TimeFormatter.format_time, Tracker::Input,
      Tracker::DeclaredGlobs, Tracker::WholeSuiteInvalidators, Storage::Schema,
      Storage::Snapshot, Storage::Backend, Tracker::DependencyGraph,
      Tracker::ExampleRegistry, Tracker::Filter, Tracker::LoadedFilesTracker,
      Rails::Preset, Tracker::EnvSnapshot) must each hit >= 90% (< 2 min budget)
    env:
      RSPEC_TRACER_DISABLE: '1'
    cmds:
      # mutant requires MRI >= 3.2; skip quietly on Ruby 3.1 / JRuby / any env
      # where the Gemfile's install_if guard kept the gem out.
      #
      # Two independent subjects, parsed separately. mutant exits non-zero
      # whenever any mutation survives; we care about the coverage percentage
      # per subject and fail the task if either is below the 90% gate.
      - |
        if ! bundle show mutant >/dev/null 2>&1; then
          echo "skip: mutant not installed on this Ruby (needs MRI >= 3.2)"
          exit 0
        fi

        run_mutant_subject() {
          local label="$1" require_path="$2" matcher="$3"
          echo "=== mutation:smoke [$label] ==="
          local out cov
          out=$(bundle exec mutant run --use rspec --usage opensource \
            --include lib --require "$require_path" "$matcher" 2>&1 || true)
          echo "$out"
          cov=$(echo "$out" | awk '/^Coverage:/ { gsub(/%/, "", $2); print $2 }' | tail -1)
          if [ -z "$cov" ]; then
            echo "ERROR [$label]: could not parse mutant coverage"
            return 1
          fi
          if awk "BEGIN { exit ($cov >= 90) ? 0 : 1 }"; then
            echo "mutation:smoke [$label] PASS (coverage $cov% >= 90%)"
            return 0
          fi
          echo "mutation:smoke [$label] FAIL (coverage $cov% < 90%)"
          return 1
        }

        fail=0
        run_mutant_subject "TimeFormatter.format_time" \
          "rspec_tracer/time_formatter" \
          "RSpecTracer::TimeFormatter.format_time" || fail=1
        run_mutant_subject "Tracker::Input" \
          "rspec_tracer/tracker/input" \
          "RSpecTracer::Tracker::Input*" || fail=1
        run_mutant_subject "Tracker::DeclaredGlobs" \
          "rspec_tracer/tracker/declared_globs" \
          "RSpecTracer::Tracker::DeclaredGlobs*" || fail=1
        run_mutant_subject "Tracker::WholeSuiteInvalidators" \
          "rspec_tracer/tracker/whole_suite_invalidators" \
          "RSpecTracer::Tracker::WholeSuiteInvalidators*" || fail=1
        run_mutant_subject "Storage::Schema" \
          "rspec_tracer/storage/schema" \
          "RSpecTracer::Storage::Schema*" || fail=1
        run_mutant_subject "Storage::Snapshot" \
          "rspec_tracer/storage/snapshot" \
          "RSpecTracer::Storage::Snapshot*" || fail=1
        run_mutant_subject "Storage::Backend" \
          "rspec_tracer/storage/backend" \
          "RSpecTracer::Storage::Backend*" || fail=1
        run_mutant_subject "Tracker::DependencyGraph" \
          "rspec_tracer/tracker/dependency_graph" \
          "RSpecTracer::Tracker::DependencyGraph*" || fail=1
        run_mutant_subject "Tracker::ExampleRegistry" \
          "rspec_tracer/tracker/example_registry" \
          "RSpecTracer::Tracker::ExampleRegistry*" || fail=1
        run_mutant_subject "Tracker::Filter" \
          "rspec_tracer/tracker/filter" \
          "RSpecTracer::Tracker::Filter*" || fail=1
        run_mutant_subject "Tracker::LoadedFilesTracker" \
          "rspec_tracer/tracker/loaded_files_tracker" \
          "RSpecTracer::Tracker::LoadedFilesTracker*" || fail=1
        run_mutant_subject "Rails::Preset" \
          "rspec_tracer/rails/preset" \
          "RSpecTracer::Rails::Preset*" || fail=1
        run_mutant_subject "Tracker::EnvSnapshot" \
          "rspec_tracer/tracker/env_snapshot" \
          "RSpecTracer::Tracker::EnvSnapshot*" || fail=1
        # Rails::Notifications deferred to M8.3 - the subscribe-side
        # surface (ActiveSupport::Notifications stubs + thread-local
        # bucket lifecycle) yields a large population of alive
        # mutations that are either equivalents or subscribe-call
        # shape. Baseline is 78.77% (594/754 kills); narrowing to
        # pure-logic methods (record_template / record_ar_schema /
        # build_schema_inputs) is an M8.3 task, not M4.2 scope.
        # Rails::I18nTracking follows the same rationale.
        exit "$fail"

  test:mutation:tracker:
    desc: >-
      M8.3-A mutation pass on tracker/ net-new subjects (CoverageAdapter,
      NewFileDetector, IOHooks). Per-subject gates reflect a maintainer-
      approved carve-out for structural mutation-tooling ceilings:
      IOHooks (Module#prepend idempotency + no unprepend API; rspec-mocks
      spy trips on File<IO inheritance) and NewFileDetector (mutant
      first-token mapping doesn't credit constructor walker setup to
      #initialize when tests live under `describe '#new_files'`).
      The 8 existing tracker subjects (Input, DeclaredGlobs,
      WholeSuiteInvalidators, DependencyGraph, ExampleRegistry, Filter,
      LoadedFilesTracker, EnvSnapshot) stay in test:mutation:smoke.
    env:
      RSPEC_TRACER_DISABLE: '1'
    cmds:
      - |
        if ! bundle show mutant >/dev/null 2>&1; then
          echo "skip: mutant not installed on this Ruby (needs MRI >= 3.2)"
          exit 0
        fi

        run_mutant_gate() {
          local label="$1" require_path="$2" matcher="$3" gate="$4"
          echo "=== mutation:tracker [$label] ==="
          local out cov
          out=$(bundle exec mutant run --use rspec --usage opensource \
            --include lib --require "$require_path" "$matcher" 2>&1 || true)
          echo "$out"
          cov=$(echo "$out" | awk '/^Coverage:/ { gsub(/%/, "", $2); print $2 }' | tail -1)
          if [ -z "$cov" ]; then
            echo "ERROR [$label]: could not parse mutant coverage"
            return 1
          fi
          if awk "BEGIN { exit ($cov >= $gate) ? 0 : 1 }"; then
            echo "mutation:tracker [$label] PASS (coverage $cov% >= $gate%)"
            return 0
          fi
          echo "mutation:tracker [$label] FAIL (coverage $cov% < $gate%)"
          return 1
        }

        fail=0
        # CI ubuntu-latest margins: gate values sit ~3 pp under
        # the M2 Max local baseline so test-order / gem-resolution
        # variance between environments does not flip a passing
        # subject red.
        run_mutant_gate "Tracker::CoverageAdapter" \
          "rspec_tracer/tracker/coverage_adapter" \
          "RSpecTracer::Tracker::CoverageAdapter*" 87 || fail=1
        run_mutant_gate "Tracker::NewFileDetector" \
          "rspec_tracer/tracker/new_file_detector" \
          "RSpecTracer::Tracker::NewFileDetector*" 82 || fail=1
        run_mutant_gate "Tracker::IOHooks" \
          "rspec_tracer/tracker/io_hooks" \
          "RSpecTracer::Tracker::IOHooks*" 77 || fail=1
        exit "$fail"

  test:mutation:storage:
    desc: >-
      M8.3-A mutation pass on storage/ net-new subjects (LazySnapshot,
      Serializer::Json, Serializer::Msgpack, JsonBackend, SqliteBackend).
      SqliteBackend carve-out (>= 73%) for prose-label describes that
      don't map cleanly into mutant's first-token Klass#method scheme.
      Storage::Schema, Storage::Snapshot, Storage::Backend stay in
      test:mutation:smoke.

      Local single-command surface — runs all storage shards in
      sequence. M8.6 split the storage mutation surface into 5 parallel
      CI jobs (refined post-first-CI to balance honest signal with
      wall-clock budget):
        - misc: 3 small subjects (LazySnapshot + Serializer::Json/Msgpack)
        - json-backend-shard-1 / json-backend-shard-2: JsonBackend's
          50 subjects split alphabetically; default `--mutation-timeout 5`
          + `--jobs 8`. (An earlier attempt with `--mutation-timeout 1`
          was reverted because shorter timeout silently shifts mutations
          whose tests would have passed within 1-5s into the
          Killed-via-timeout bucket — that's coverage inflation, not
          honest signal.)
        - sqlite-read: 15 read-side SqliteBackend subjects.
        - sqlite-write: 30 write-side + connection/schema/utility subjects.
    cmds:
      - task: test:mutation:storage:misc
      - task: test:mutation:storage:json-backend
      - task: test:mutation:storage:sqlite-read
      - task: test:mutation:storage:sqlite-write

  test:mutation:storage:misc:
    desc: >-
      M8.6 storage shard — small non-JsonBackend / non-SqliteBackend
      subjects (LazySnapshot, Serializer::Json, Serializer::Msgpack).
      Combined CI wall clock under 2 min. Same gates as the M8.3-A
      Taskfile entry.
    env:
      RSPEC_TRACER_DISABLE: '1'
    cmds:
      - |
        if ! bundle show mutant >/dev/null 2>&1; then
          echo "skip: mutant not installed on this Ruby (needs MRI >= 3.2)"
          exit 0
        fi

        run_mutant_gate() {
          local label="$1" require_path="$2" gate="$3"
          shift 3
          echo "=== mutation:storage [$label] ==="
          local out cov
          out=$(bundle exec mutant run --use rspec --usage opensource \
            --include lib --require "$require_path" "$@" 2>&1 || true)
          echo "$out"
          cov=$(echo "$out" | awk '/^Coverage:/ { gsub(/%/, "", $2); print $2 }' | tail -1)
          if [ -z "$cov" ]; then
            echo "ERROR [$label]: could not parse mutant coverage"
            return 1
          fi
          if awk "BEGIN { exit ($cov >= $gate) ? 0 : 1 }"; then
            echo "mutation:storage [$label] PASS (coverage $cov% >= $gate%)"
            return 0
          fi
          echo "mutation:storage [$label] FAIL (coverage $cov% < $gate%)"
          return 1
        }

        fail=0
        # Gates preserved verbatim from the M8.3-A storage Taskfile
        # entry. Msgpack carve-out rationale documented in the M8.3-A
        # retro + feedback_mutant_local_vs_ci_variance.
        run_mutant_gate "Storage::LazySnapshot" \
          "rspec_tracer/storage/lazy_snapshot" 85 \
          "RSpecTracer::Storage::LazySnapshot*" || fail=1
        run_mutant_gate "Storage::Serializer::Json" \
          "rspec_tracer/storage/serializer/json" 85 \
          "RSpecTracer::Storage::Serializer::Json*" || fail=1
        run_mutant_gate "Storage::Serializer::Msgpack" \
          "rspec_tracer/storage/serializer/msgpack" 65 \
          "RSpecTracer::Storage::Serializer::Msgpack*" || fail=1
        exit "$fail"

  test:mutation:storage:json-backend:
    desc: >-
      M8.6 storage aggregate — Storage::JsonBackend split into 9
      sibling shards (`json-backend-shard-{1..9}`) that run as
      separate parallel CI jobs. JsonBackend has 50 mutant subjects
      (43 instance methods + FieldReader nested class + Merger nested
      class with 6 class methods). 5-way split chosen because the
      write-heavy subjects (`save_graph`, `transactional_save`,
      `prune_run_dirs!`, `write_*_atomic`) drive disproportionate wall
      clock — earlier 3-way alphabetical split landed shard-3 at
      6:52 M2 Max (~10 min CI) vs shard-1/2 at 1-3 min. The original
      shard-3 has been further split into 3 sub-shards (now shard-3 /
      shard-4 / shard-5) by I/O density to enforce the 4-minute hard
      cap (step-level `timeout-minutes: 4` on each mutation shard).

      Earlier attempt with `--mutation-timeout 1` was reverted because
      shorter timeout silently shifts undetected mutations (test would
      have passed within 1-5s) into the Killed-via-timeout bucket —
      that's coverage inflation, not honest signal. Sharding (same
