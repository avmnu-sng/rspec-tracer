version: '3'

set: [errexit, nounset, pipefail]

vars:
  RUBY_VERSION:
    sh: cat .ruby-version
  VERSION:
    # -Ilib + -r avoids `require_relative` under `ruby -e`, which JRuby
    # can't resolve (LoadError: cannot infer basepath). Same pattern as
    # release.yml's tag-vs-VERSION check.
    sh: ruby -Ilib -rrspec_tracer/version -e 'puts RSpecTracer::VERSION'
  # Tool versions — bump intentionally, not accidentally.
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: v0.11.0
  YAMLLINT_VERSION: 1.37.1
  BUNDLER_AUDIT_VERSION: 0.9.2
  LICENSE_FINDER_VERSION: 7.2.1
  TRIVY_VERSION: v0.69.3

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ── Setup ──────────────────────────────────────────────

  ruby:version-check:
    internal: true
    cmds:
      - |
        ACTUAL=$(ruby -e "puts RUBY_VERSION")
        if [ "$ACTUAL" != "{{.RUBY_VERSION}}" ]; then
          echo "Ruby version mismatch: expected {{.RUBY_VERSION}}, got $ACTUAL"
          echo "Run 'task install:ruby'"; exit 1
        fi

  install:ruby:
    desc: Install the Ruby version from .ruby-version via rbenv
    preconditions:
      - sh: command -v rbenv >/dev/null 2>&1
        msg: "rbenv not found; install: brew install rbenv"
    cmds:
      - rbenv install --skip-existing {{.RUBY_VERSION}}

  install:tools:
    desc: Install all pinned dev tools (binaries + yamllint venv + bundler-audit gem)
    # Everything lands under ./bin/ or ./.venv/ — no writes to system dirs,
    # no sudo, no PIPX_HOME gymnastics. Same install works on local Mac,
    # local Linux, and GHA runners.
    #   bin/actionlint, bin/shellcheck — direct curl + tar to ./bin/
    #   bin/yamllint                   — symlink to .venv/yamllint/bin/yamllint
    #   bundler-audit gem              — installed to the active Ruby's gem
    #                                    dir (setup-ruby handles PATH on CI;
    #                                    rbenv/asdf shims handle it locally)
    deps: [ruby:version-check]
    preconditions:
      - sh: command -v python3 >/dev/null 2>&1
        msg: "python3 not found; install: 'brew install python@3.12' (mac) — Ubuntu ships it"
    status:
      - test -x bin/actionlint
      - test -x bin/shellcheck
      - test -x bin/yamllint
      - test -x bin/trivy
      - gem list -i bundler-audit --version {{.BUNDLER_AUDIT_VERSION}}
    cmds:
      - bundle install
      - |
        # actionlint: release naming uses amd64/arm64. `uname -m` on Linux
        # returns x86_64; on Apple Silicon returns arm64. Map both.
        mkdir -p bin
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          aarch64|arm64) ARCH=arm64 ;;
          x86_64|amd64)  ARCH=amd64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v{{.ACTIONLINT_VERSION}}/actionlint_{{.ACTIONLINT_VERSION}}_${OS}_${ARCH}.tar.gz" \
          | tar xz -C bin actionlint
      - |
        # shellcheck: release naming uses x86_64/aarch64 (not amd64/arm64).
        mkdir -p bin
        VERSION={{.SHELLCHECK_VERSION}}
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          aarch64|arm64) ARCH=aarch64 ;;
          x86_64|amd64)  ARCH=x86_64 ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/${VERSION}/shellcheck-${VERSION}.${OS}.${ARCH}.tar.xz" \
          | tar xJ --strip-components=1 -C bin "shellcheck-${VERSION}/shellcheck"
      - |
        # yamllint: user-scoped venv under .venv/yamllint. Works identically
        # on local dev and GHA runners (pipx on GHA is pre-configured for
        # /opt/pipx system-wide, which non-sudo writes can't reach).
        mkdir -p bin
        python3 -m venv .venv/yamllint
        .venv/yamllint/bin/pip install --quiet --disable-pip-version-check "yamllint=={{.YAMLLINT_VERSION}}"
        ln -sf "$(pwd)/.venv/yamllint/bin/yamllint" bin/yamllint
      - |
        # trivy: official install script handles arch detection + pins
        # the version. Lands in ./bin/trivy.
        mkdir -p bin
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sh -s -- -b "$(pwd)/bin" {{.TRIVY_VERSION}}
      - gem install bundler-audit --version {{.BUNDLER_AUDIT_VERSION}} --no-doc

  # ── Lint ───────────────────────────────────────────────

  lint:ruby:
    desc: Run RuboCop (parallel)
    cmds:
      - bundle exec rubocop --parallel --format progress

  lint:actions:
    desc: Lint GitHub Actions workflows
    # actionlint shells out to `shellcheck` via Go's exec.LookPath,
    # which walks $PATH. On machines with goenv on PATH, its
    # shim directory (~/.goenv/shims/) precedes our bin/ and exposes
    # a shellcheck shim that errors unless a Go version currently has
    # shellcheck installed. Pin shellcheck to the project-installed
    # binary explicitly - any path with a slash bypasses PATH lookup.
    # Empty -pyflakes disables the Python lint pass we don't install.
    cmds:
      - bin/actionlint -shellcheck=./bin/shellcheck -pyflakes=

  lint:shell:
    desc: Lint shell scripts
    cmds:
      - |
        SCRIPTS=$(find . -name '*.sh' -not -path './.git/*' -not -path './tmp/*' -not -path './coverage/*' -not -path './rspec_tracer_*/*' 2>/dev/null || true)
        if [ -n "$SCRIPTS" ]; then
          echo "$SCRIPTS" | xargs bin/shellcheck
        else
          echo "No shell scripts to lint."
        fi

  lint:yaml:
    desc: Lint YAML files
    cmds:
      - bin/yamllint --strict .

  lint:node:
    desc: Lint + format check the HTML reporter frontend (ESLint + Prettier)
    dir: lib/rspec_tracer/reporters/html
    preconditions:
      - sh: test -d node_modules
        msg: "node_modules missing; run `task reporters:html:install` first"
    cmds:
      - npm run lint
      - npm run format

  lint:all:
    desc: Run every linter
    cmds:
      - task: lint:ruby
      - task: lint:actions
      - task: lint:shell
      - task: lint:yaml
      - task: lint:node

  # ── Checks (format / tidy) ─────────────────────────────

  check:bundle:
    desc: Verify Gemfile.lock is installable
    cmds:
      - bundle check

  check:all:
    cmds:
      - task: check:bundle

  # ── Tests ──────────────────────────────────────────────

  test:unit:
    desc: Unit tests (fast)
    cmds:
      - bundle exec rspec --fail-fast

  test:contract:
    desc: Contract tests (storage + remote cache backends)
    cmds:
      - bundle exec rspec spec/contracts

  test:integration:
    desc: >-
      Integration tests (ruby_app subprocess + dogfood + constants regression).
      Excludes rails_app (see `test:features:rails`) and parallel_tests (see
      `test:integration:parallel`) because both exceed the fast-feedback budget.
      Files listed explicitly: `.rspec`'s --exclude-pattern does not apply when
      positional paths are passed.
    cmds:
      - bundle exec rspec spec/integration/dogfood_spec.rb spec/integration/ruby_app_spec.rb spec/integration/constants_regression_spec.rb

  test:integration:parallel:
    desc: >-
      M5.1 parallel_tests integration test. Drives the benchmark ruby_app fixture
      under `parallel_rspec spec` and asserts the merged top-level cache shape.
      Excluded from the default rspec sweep (via .rspec --exclude-pattern) because
      each example spawns worker subprocesses.
    cmds:
      - bundle exec rspec --no-color spec/integration/parallel_tests_spec.rb

  test:property:
    desc: Property-based invariant tests
    cmds:
      - bundle exec rspec spec/properties

  test:fuzz:smoke:
    desc: Fuzz smoke — 100 random-byte iterations against the v2 JSON backend loader
    cmds:
      - ITERATIONS=100 bundle exec ruby spec/fuzz/json_backend_fuzz.rb

  test:fuzz:full:
    desc: Fuzz full — 10000 iterations (weekly CI only)
    cmds:
      - ITERATIONS=10000 bundle exec ruby spec/fuzz/json_backend_fuzz.rb

  test:mutation:smoke:
    desc: >-
      Mutation smoke — 13 subjects (TimeFormatter.format_time, Tracker::Input,
      Tracker::DeclaredGlobs, Tracker::WholeSuiteInvalidators, Storage::Schema,
      Storage::Snapshot, Storage::Backend, Tracker::DependencyGraph,
      Tracker::ExampleRegistry, Tracker::Filter, Tracker::LoadedFilesTracker,
      Rails::Preset, Tracker::EnvSnapshot) must each hit >= 90% (< 2 min budget)
    env:
      RSPEC_TRACER_DISABLE: '1'
    cmds:
      # mutant requires MRI >= 3.2; skip quietly on Ruby 3.1 / JRuby / any env
      # where the Gemfile's install_if guard kept the gem out.
      #
      # Two independent subjects, parsed separately. mutant exits non-zero
      # whenever any mutation survives; we care about the coverage percentage
      # per subject and fail the task if either is below the 90% gate.
      - |
        if ! bundle show mutant >/dev/null 2>&1; then
          echo "skip: mutant not installed on this Ruby (needs MRI >= 3.2)"
          exit 0
        fi

        run_mutant_subject() {
          local label="$1" require_path="$2" matcher="$3"
          echo "=== mutation:smoke [$label] ==="
          local out cov
          out=$(bundle exec mutant run --use rspec --usage opensource \
            --include lib --require "$require_path" "$matcher" 2>&1 || true)
          echo "$out"
          cov=$(echo "$out" | awk '/^Coverage:/ { gsub(/%/, "", $2); print $2 }' | tail -1)
          if [ -z "$cov" ]; then
            echo "ERROR [$label]: could not parse mutant coverage"
            return 1
          fi
          if awk "BEGIN { exit ($cov >= 90) ? 0 : 1 }"; then
            echo "mutation:smoke [$label] PASS (coverage $cov% >= 90%)"
            return 0
          fi
          echo "mutation:smoke [$label] FAIL (coverage $cov% < 90%)"
          return 1
        }

        fail=0
        run_mutant_subject "TimeFormatter.format_time" \
          "rspec_tracer/time_formatter" \
          "RSpecTracer::TimeFormatter.format_time" || fail=1
        run_mutant_subject "Tracker::Input" \
          "rspec_tracer/tracker/input" \
          "RSpecTracer::Tracker::Input*" || fail=1
        run_mutant_subject "Tracker::DeclaredGlobs" \
          "rspec_tracer/tracker/declared_globs" \
          "RSpecTracer::Tracker::DeclaredGlobs*" || fail=1
        run_mutant_subject "Tracker::WholeSuiteInvalidators" \
          "rspec_tracer/tracker/whole_suite_invalidators" \
          "RSpecTracer::Tracker::WholeSuiteInvalidators*" || fail=1
        run_mutant_subject "Storage::Schema" \
          "rspec_tracer/storage/schema" \
          "RSpecTracer::Storage::Schema*" || fail=1
        run_mutant_subject "Storage::Snapshot" \
          "rspec_tracer/storage/snapshot" \
          "RSpecTracer::Storage::Snapshot*" || fail=1
        run_mutant_subject "Storage::Backend" \
          "rspec_tracer/storage/backend" \
          "RSpecTracer::Storage::Backend*" || fail=1
        run_mutant_subject "Tracker::DependencyGraph" \
          "rspec_tracer/tracker/dependency_graph" \
          "RSpecTracer::Tracker::DependencyGraph*" || fail=1
        run_mutant_subject "Tracker::ExampleRegistry" \
          "rspec_tracer/tracker/example_registry" \
          "RSpecTracer::Tracker::ExampleRegistry*" || fail=1
        run_mutant_subject "Tracker::Filter" \
          "rspec_tracer/tracker/filter" \
          "RSpecTracer::Tracker::Filter*" || fail=1
        run_mutant_subject "Tracker::LoadedFilesTracker" \
          "rspec_tracer/tracker/loaded_files_tracker" \
          "RSpecTracer::Tracker::LoadedFilesTracker*" || fail=1
        run_mutant_subject "Rails::Preset" \
          "rspec_tracer/rails/preset" \
          "RSpecTracer::Rails::Preset*" || fail=1
        run_mutant_subject "Tracker::EnvSnapshot" \
          "rspec_tracer/tracker/env_snapshot" \
          "RSpecTracer::Tracker::EnvSnapshot*" || fail=1
        # Rails::Notifications deferred to M8.3 - the subscribe-side
        # surface (ActiveSupport::Notifications stubs + thread-local
        # bucket lifecycle) yields a large population of alive
        # mutations that are either equivalents or subscribe-call
        # shape. Baseline is 78.77% (594/754 kills); narrowing to
        # pure-logic methods (record_template / record_ar_schema /
        # build_schema_inputs) is an M8.3 task, not M4.2 scope.
        # Rails::I18nTracking follows the same rationale.
        exit "$fail"

  test:mutation:full:
    desc: Mutation full — whole TimeFormatter module (informational, weekly CI only)
    env:
      RSPEC_TRACER_DISABLE: '1'
    cmds:
      - |
        if ! bundle show mutant >/dev/null 2>&1; then
          echo "skip: mutant not installed on this Ruby (needs MRI >= 3.2)"
          exit 0
        fi
        # Private helpers (format_duration, strip_trailing_zeroes, pluralize)
        # have no direct tests today; coverage on the whole module is expected
        # to trail smoke until M8.3. Run anyway, report, don't gate.
        bundle exec mutant run --use rspec --usage opensource \
          --include lib --require rspec_tracer/time_formatter \
          "RSpecTracer::TimeFormatter*" || true

  test:dogfood:
    desc: Dogfood — run rspec-tracer against the benchmark ruby_app fixture, cold + warm
    cmds:
      - bundle exec rspec spec/integration/dogfood_spec.rb

  test:all:
    desc: Unit + contract + property (no integration — slow)
    cmds:
      - task: test:unit
      - task: test:contract
      - task: test:property

  test:everything:
    desc: Every test suite, including integration
    cmds:
      - task: test:all
      - task: test:integration

  # ── Cucumber features (legacy, removed in 2.0.0) ───────

  test:features:ruby:
    desc: >-
      M5.1 ruby_app integration test (swapped from cucumber; the legacy
      cucumber scenarios asserted on 1.x cache layout - 10 files, spec_helper
      in all_files - that v2 no longer produces). Same M4.3 c2 precedent as
      test:features:rails.
    cmds:
      - bundle exec rspec --no-color spec/integration/ruby_app_spec.rb spec/integration/dogfood_spec.rb

  test:features:ruby-parallel:
    desc: >-
      M5.1 parallel_tests integration test (swapped from cucumber; the legacy
      cucumber scenarios asserted on 1.x cache layout that v2 no longer writes).
    cmds:
      - task: test:integration:parallel

  test:features:rails:
    desc: >-
      M4.3 Rails integration test against the reference Rails app. Excluded
      from the default rspec sweep (via .rspec --exclude-pattern) because a
      full cycle is 12 scenarios x cold+warm subprocess runs, ~2-3 minutes.
      The CI `rails` job invokes this per Rails matrix cell.
    cmds:
      - bundle exec rspec --no-color spec/integration/rails_app_spec.rb

  test:integration:per-example-dsl:
    desc: >-
      M5.2 per-example tracks DSL integration test. Drives the Rails fixture
      with a feature_flags_spec annotated with tracks: { env: ... }, cold/warm
      with the tracked env flipped, asserts only the env-branch examples
      re-run. Excluded from the default rspec sweep (subprocess, ~45s).
    cmds:
      - bundle exec rspec --no-color spec/integration/per_example_dsl_spec.rb

  ci:localstack:ready:
    desc: >-
      Wait for LocalStack S3 to be healthy, then run a small smoke probe
      (mb + cp + head + ls + rm + rb). Runs before test:integration:remote-cache.
      Skips (exits 0) when `awslocal` or `curl` are absent so local dev
      without LocalStack does not fail the broader test task graph.
      LOCALSTACK_ENDPOINT controls the base URL (default http://localhost:4566).
    vars:
      ENDPOINT:
        sh: echo "${LOCALSTACK_ENDPOINT:-http://localhost:4566}"
    cmds:
      - |
        if ! command -v awslocal >/dev/null 2>&1; then
          echo "skip: awslocal not on PATH (install: pipx install awscli-local)"
          exit 0
        fi
        if ! command -v curl >/dev/null 2>&1; then
          echo "skip: curl not on PATH"
          exit 0
        fi

        # Step 1: poll /_localstack/health for up to 60s.
        ready=0
        for i in $(seq 1 60); do
          body=$(curl -sSf "{{.ENDPOINT}}/_localstack/health" 2>/dev/null || true)
          if [ -n "$body" ] && printf '%s' "$body" | grep -qE '"s3":[[:space:]]*"(running|available)"'; then
            echo "localstack s3 ready in ${i}s"
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "ERROR: localstack s3 did not report ready within 60s" >&2
          echo "health response: $body" >&2
          exit 1
        fi

        # Step 2: smoke-probe the exact operations S3Backend uses.
        bucket="rspec-tracer-smoke-$$"
        tmp=$(mktemp)
        echo "probe" > "$tmp"
        trap 'rm -f "$tmp"; awslocal s3 rb "s3://${bucket}" --force >/dev/null 2>&1 || true' EXIT

        awslocal s3 mb "s3://${bucket}" >/dev/null
        awslocal s3 cp "$tmp" "s3://${bucket}/probe.txt" >/dev/null
        awslocal s3api head-object --bucket "${bucket}" --key probe.txt >/dev/null
        awslocal s3 ls "s3://${bucket}/" | grep -q probe.txt
        awslocal s3 rm "s3://${bucket}/probe.txt" >/dev/null
        awslocal s3 rb "s3://${bucket}" >/dev/null
        echo "localstack s3 smoke probe OK"

  test:integration:remote-cache:
    desc: >-
      M7.1 S3Backend integration test against LocalStack. End-to-end
      round-trip (upload + download + branch_refs + retention) against
      the real S3 API surface via awslocal. Excluded from the default
      rspec sweep. Depends on ci:localstack:ready so CI fails fast with
      a clear message if LocalStack is not reachable.
    deps: [ci:localstack:ready]
    cmds:
      - bundle exec rspec --no-color spec/integration/remote_cache_spec.rb

  ci:redis:ready:
    desc: >-
      Wait for Redis to be healthy on REDIS_URL (default redis://localhost:6379/15)
      and run a small smoke probe. Skips (exits 0) when `redis-cli` is absent
      so local dev without Redis does not fail the broader task graph.
    vars:
      URL:
        sh: echo "${REDIS_URL:-redis://localhost:6379/15}"
    cmds:
      - |
        if ! command -v redis-cli >/dev/null 2>&1; then
          echo "skip: redis-cli not on PATH (install: brew install redis)"
          exit 0
        fi

        # Step 1: poll PING for up to 30s.
        ready=0
        for _ in $(seq 1 30); do
          if redis-cli -u "{{.URL}}" PING 2>/dev/null | grep -q PONG; then
            echo "redis ready"
            ready=1
            break
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "ERROR: redis did not respond to PING within 30s at {{.URL}}" >&2
          exit 1
        fi

        # Step 2: smoke probe the exact op set RedisBackend uses.
        bucket="rspec-tracer-smoke-$$"
        redis-cli -u "{{.URL}}" SET "${bucket}:probe" "probe-value" >/dev/null
        redis-cli -u "{{.URL}}" GET "${bucket}:probe" | grep -q probe-value
        redis-cli -u "{{.URL}}" HSET "${bucket}:hash" field value >/dev/null
        redis-cli -u "{{.URL}}" HGET "${bucket}:hash" field | grep -q value
        redis-cli -u "{{.URL}}" DEL "${bucket}:probe" "${bucket}:hash" >/dev/null
        echo "redis smoke probe OK"

  test:integration:remote-cache:redis:
    desc: >-
      M7.2 RedisBackend integration test against a real Redis server.
      End-to-end round-trip (upload + download + branch_refs + retention
      + prune_all) against localhost:6379 (override via REDIS_URL).
      Depends on ci:redis:ready so CI fails fast if Redis is not reachable.
    deps: [ci:redis:ready]
    cmds:
      - bundle exec rspec --no-color spec/integration/remote_cache_redis_spec.rb

  test:features:jruby:
    desc: >-
      M5.1 ruby_app integration test on JRuby (swapped from cucumber for the
      same reason as test:features:ruby). JRUBY_OPTS keeps the debug + object-
      space flags required for the v2 engine's observer install on JRuby 9.4.
    env:
      JRUBY_OPTS: "--debug -X+O"
    cmds:
      - bundle exec rspec --no-color spec/integration/ruby_app_spec.rb spec/integration/dogfood_spec.rb

  # ── Benchmarks ─────────────────────────────────────────

  benchmark:bundle:
    desc: bundle install for both benchmark fixtures (prerequisite for harness)
    cmds:
      - cd benchmark/fixtures/ruby_app && bundle install
      - cd spec/fixtures/rails_app && bundle install

  benchmark:smoke:
    desc: Smoke benchmark (~3s — cold_ruby + warm_noop)
    deps: [benchmark:bundle]
    cmds:
      - ruby benchmark/harness.rb --smoke --ratchet benchmark/ratchet.json

  benchmark:full:
    desc: Full benchmark suite — all 4 scenarios + ratchet comparison
    deps: [benchmark:bundle]
    cmds:
      - ruby benchmark/harness.rb --full --ratchet benchmark/ratchet.json

  benchmark:ratchet:update:
    desc: Regenerate benchmark/ratchet.json from a fresh 10-iter run (requires --yes to confirm)
    deps: [benchmark:bundle]
    cmds:
      - ruby benchmark/harness.rb --full --iterations 10 --update-ratchet benchmark/ratchet.json --yes

  # ── Security ───────────────────────────────────────────

  security:bundle-audit:
    desc: CVE scan on Gemfile.lock
    cmds:
      - bundle-audit check --update

  security:licenses:
    desc: License compliance check (optional; install via `gem install license_finder`)
    preconditions:
      - sh: command -v license_finder >/dev/null 2>&1
        msg: "license_finder not installed; run: gem install license_finder --version {{.LICENSE_FINDER_VERSION}}"
    cmds:
      - license_finder

  security:trivy:
    desc: Trivy filesystem scan (secrets + misconfig + vuln)
    cmds:
      - bin/trivy fs --config trivy.yaml --skip-version-check .

  security:all:
    cmds:
      - task: security:bundle-audit
      - task: security:trivy

  # ── Fixtures ───────────────────────────────────────────

  fixtures:rails:bundle:
    desc: bundle install in the reference Rails fixture
    dir: spec/fixtures/rails_app
    cmds:
      - bundle install

  fixtures:rails:migrate:
    desc: Create + migrate the reference Rails fixture database
    dir: spec/fixtures/rails_app
    deps: [fixtures:rails:bundle]
    cmds:
      - bundle exec rails db:drop db:create db:migrate RAILS_ENV=test
      - bundle exec rails db:drop db:create db:migrate RAILS_ENV=development

  fixtures:rails:seed:
    desc: Seed the reference Rails fixture
    dir: spec/fixtures/rails_app
    deps: [fixtures:rails:migrate]
    cmds:
      - bundle exec rails db:seed

  fixtures:rails:rspec:
    desc: Run the reference Rails fixture's RSpec suite
    dir: spec/fixtures/rails_app
    deps: [fixtures:rails:bundle]
    cmds:
      - bundle exec rails db:test:prepare
      - bundle exec rspec

  fixtures:rails:lint:
    desc: Run RuboCop against the reference Rails fixture
    # --config pins to the fixture's .rubocop.yml. Without it, rubocop's
    # parent-dir walk picks up the outer project's config (which plugs in
    # rubocop-rake, not present in the fixture bundle).
    dir: spec/fixtures/rails_app
    deps: [fixtures:rails:bundle]
    cmds:
      - bundle exec rubocop --config .rubocop.yml --format progress

  # ── Feedback loop ──────────────────────────────────────

  check:
    desc: 10-second feedback loop — lint + unit tests + smoke benchmark
    cmds:
      - task: lint:ruby
      - task: test:unit
      - task: benchmark:smoke

  # ── Full CI (local equivalent of CI pipeline) ──────────

  ci:
    desc: Full CI pipeline locally
    deps: [ruby:version-check]
    cmds:
      - task: lint:all
      - task: check:all
      - task: test:all
      - task: security:all
      - task: benchmark:full
      - task: test:integration

  # ── Reporters (HTML frontend) ──────────────────────────

  reporters:html:install:
    desc: Install npm dependencies for the HTML reporter frontend
    dir: lib/rspec_tracer/reporters/html
    preconditions:
      - sh: command -v npm >/dev/null 2>&1
        msg: "npm not found; install Node.js 20+ (nodejs.org)"
    status:
      - test -d node_modules
    cmds:
      - npm ci

  reporters:html:build:
    desc: Rebuild the committed HTML reporter bundle (dist/ is source of truth for the gem)
    dir: lib/rspec_tracer/reporters/html
    deps: [reporters:html:install]
    cmds:
      - npm run build

  reporters:html:check:
    desc: >-
      Drift check for the HTML reporter bundle. Rebuilds dist/ fresh from src/ and
      fails if `git diff` reports any change - committing a src/ edit without
      rebuilding fails here rather than at release time.
    deps: [reporters:html:build]
    cmds:
      - git diff --exit-code lib/rspec_tracer/reporters/html/dist

  # ── Gem release ────────────────────────────────────────

  gem:build:
    desc: Build the gem locally
    deps: [reporters:html:build]
    cmds:
      - mkdir -p pkg
      - gem build rspec-tracer.gemspec -o pkg/rspec-tracer-{{.VERSION}}.gem

  gem:install:local:
    desc: Build + install locally for manual smoke testing
    cmds:
      - task: gem:build
      - gem install pkg/rspec-tracer-{{.VERSION}}.gem --local --no-doc

  gem:push:
    desc: Push the built gem to RubyGems
    preconditions:
      - sh: test -n "${RUBYGEMS_API_KEY:-}"
        msg: "RUBYGEMS_API_KEY must be set"
    cmds:
      - gem push pkg/rspec-tracer-{{.VERSION}}.gem
